:root{
 --bg:#f5f5f5;--card:#ffffff;--soft:#efefef;--soft2:#e6e6e6;--line:#dedede;--ink:#222222;--mut:#727272;
 --p1:#656565;--p2:#676767;--p3:#7b7b7b;--nv:#6c6c6c;--dd:#9f9f9f;--ang:#656565;--aux:#a2a2a2;--obj:#222222;--teal:#727272;
 --acc:#606060;--accs:#eeeeee;--good:#6c6c6c;--goods:#f0f0f0;--bad:#656565;--bads:#f1f1f1;--warn:#f4f4f4;--why:#f5f5f5;--whyb:#7e7e7e;
 --grid:#e8e8e8;--grid2:#d8d8d8;--shadow:0 1px 2px rgba(20,20,20,.05),0 6px 20px rgba(20,20,20,.06);
 --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
html.dark{
 --bg:#121212;--card:#1b1b1b;--soft:#222222;--soft2:#2b2b2b;--line:#313131;--ink:#ebebeb;--mut:#a0a0a0;
 --p1:#989898;--p2:#aaaaaa;--p3:#a7a7a7;--nv:#a3a3a3;--dd:#cfcfcf;--ang:#979797;--aux:#757575;--obj:#f3f3f3;--teal:#a1a1a1;
 --acc:#939393;--accs:#2c2c2c;--goods:#292929;--bads:#252525;--warn:#313131;--why:#272727;--whyb:#aaaaaa;
 --grid:#222222;--grid2:#2d2d2d;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
b,strong{font-weight:650}
.m{font-family:Georgia,"Times New Roman",serif;font-style:italic}
.c1{color:var(--p1);font-weight:650}.c2{color:var(--p2);font-weight:650}.c3{color:var(--p3);font-weight:650}
.cnv{color:var(--nv);font-weight:650}.cdd{color:var(--dd);font-weight:650}.cang{color:var(--ang);font-weight:650}.cmut{color:var(--mut)}
/* header */
header{position:sticky;top:0;z-index:50;height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:17px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--p1),var(--p2));color:var(--onacc);display:grid;place-items:center;font-size:15px}
.sp{flex:1}
.xp{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 6px;font-size:14px;white-space:nowrap}
.xp .lv{background:var(--acc);color:var(--onacc);border-radius:999px;padding:1px 9px;font-weight:700;font-size:12px}
.xp .bar{width:80px;height:6px;background:var(--soft2);border-radius:9px;overflow:hidden}
.xp .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--nv),var(--p1));width:0;transition:width .5s}
.xp.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.08)}}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;height:36px;min-width:36px;padding:0 10px}
.iconbtn:hover{background:var(--soft)}
#menuBtn{display:none}
/* layout */
.layout{display:flex;align-items:flex-start}
nav#side{position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;width:290px;flex:none;border-right:1px solid var(--line);background:var(--card);padding:12px 10px 40px}
.mod{margin:10px 4px 4px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;display:flex;justify-content:space-between}
.navi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:7px 9px;font-size:14.5px;line-height:1.3}
.navi:hover{background:var(--soft)}
.navi.on{background:var(--accs);color:var(--acc);font-weight:650}
.navi .dot{width:20px;height:20px;border-radius:50%;flex:none;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:var(--onacc)}
.navi.seen .dot{border-color:var(--acc)}
.navi.done .dot{background:var(--good);border-color:var(--good)}
.navi.done .dot::after{content:"✓"}
main{flex:1;min-width:0;padding:26px 26px 80px}
.sec{max-width:1060px;margin:0 auto;display:none}
.sec.on{display:block;animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.kicker{font-size:13px;color:var(--acc);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
h1{font-size:30px;line-height:1.2;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-size:21px;margin:30px 0 10px;letter-spacing:-.01em}
h3{font-size:17px;margin:18px 0 6px}
.lead{font-size:17px;color:var(--mut);margin:0 0 18px}
p{margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);margin:14px 0}
.hook{background:linear-gradient(135deg,var(--accs),transparent);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:14px;padding:14px 18px;margin:14px 0}
.hook .t{font-weight:750;font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.why{background:var(--why);border-left:5px solid var(--whyb);border-radius:14px;padding:12px 18px;margin:14px 0}
.why .t{font-weight:750;color:var(--whyb);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.rule{background:var(--goods);border-left:5px solid var(--good);border-radius:14px;padding:12px 18px;margin:14px 0}
.rule .t{font-weight:750;color:var(--good);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.trap{background:var(--bads);border-left:5px solid var(--bad);border-radius:14px;padding:12px 18px;margin:14px 0}
.trap .t{font-weight:750;color:var(--bad);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.mem{background:var(--warn);border-left:5px solid var(--dd);border-radius:14px;padding:12px 18px;margin:14px 0}
.mem .t{font-weight:750;color:var(--dd);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
html.dark .mem .t{color:var(--dd)}
ul,ol{padding-left:22px;margin:6px 0}
li{margin:3px 0}
table.tb{border-collapse:collapse;width:100%;font-size:14.5px;margin:10px 0;background:var(--card);border-radius:12px;overflow:hidden}
.tb th,.tb td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tb th{background:var(--soft);font-weight:650}
.tb tr.hlrow td{background:var(--accs)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{border:0;background:var(--acc);color:var(--onacc);border-radius:11px;padding:9px 16px;font-weight:650;transition:transform .08s,opacity .2s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.good{background:var(--good)}
.btn.sm{padding:5px 11px;font-size:14px;border-radius:9px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 11px;font-size:14px}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:650;color:var(--acc)}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:10px 0}
.sl{display:flex;align-items:center;gap:8px;font-size:14px}
.sl input[type=range]{width:150px;accent-color:var(--acc)}
.sl output{min-width:34px;font-weight:700;font-variant-numeric:tabular-nums}
.reads{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.rd{background:var(--soft);border-radius:10px;padding:7px 10px;font-size:13px}
.rd b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
/* 3D */
.v3{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.v3 canvas{display:block;width:100%;touch-action:none;cursor:grab}
.v3 canvas:active{cursor:grabbing}
.v3-bar{display:flex;flex-wrap:wrap;gap:5px;padding:8px;border-top:1px solid var(--line);background:var(--soft)}
.v3-bar button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;font-size:13px}
.v3-bar button.on{border-color:var(--acc);color:var(--acc);font-weight:650}
.v3-hint{position:absolute;top:8px;left:10px;font-size:12px;color:var(--mut);pointer-events:none;background:color-mix(in srgb,var(--card) 80%,transparent);border-radius:6px;padding:2px 6px}
/* epure */
.ep{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;justify-content:center;align-items:center;padding:6px;overflow:hidden;touch-action:none}
.ep svg{display:block;overflow:hidden}
.ep text{font-family:var(--sans);paint-order:stroke;stroke:var(--card);stroke-linejoin:round}
.s-c1{stroke:var(--p1)}.s-c2{stroke:var(--p2)}.s-c3{stroke:var(--p3)}.s-nv{stroke:var(--nv)}.s-dd{stroke:var(--dd)}.s-ang{stroke:var(--ang)}.s-aux{stroke:var(--aux)}.s-ink{stroke:var(--ink)}.s-teal{stroke:var(--teal)}.s-grid{stroke:var(--grid)}.s-grid2{stroke:var(--grid2)}.s-mut{stroke:var(--mut)}.s-bg{stroke:var(--card)}
.f-c1{fill:var(--p1)}.f-c2{fill:var(--p2)}.f-c3{fill:var(--p3)}.f-nv{fill:var(--nv)}.f-dd{fill:var(--dd)}.f-ang{fill:var(--ang)}.f-aux{fill:var(--aux)}.f-ink{fill:var(--ink)}.f-teal{fill:var(--teal)}.f-mut{fill:var(--mut)}.f-acc{fill:var(--acc)}
.hl{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{opacity:.35}}
.handle{cursor:grab}
.hring{animation:ring 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
/* MCQ */
.mcq{margin:12px 0}
.mcq .q{font-weight:650;margin-bottom:8px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 13px;font-size:15px;transition:border-color .15s,background .15s,transform .08s;line-height:1.35}
.opt:hover{border-color:var(--acc)}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--good);background:var(--goods)}
.opt.bad{border-color:var(--bad);background:var(--bads);animation:shake .35s}
.opt.ghostok{border-color:var(--good);border-style:dashed}
.opt.dis{pointer-events:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:10px;font-size:15px}
.fb:empty{display:none}
.fb .box{border-radius:12px;padding:10px 14px}
.fb .ok{background:var(--goods)}
.fb .bad{background:var(--bads)}
.chk{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0;cursor:pointer;background:var(--card)}
.chk input{margin-top:4px;accent-color:var(--acc)}
.chk.ok{border-color:var(--good);background:var(--goods)}
.chk.bad{border-color:var(--bad);background:var(--bads)}
.chk.miss{border-color:var(--good);border-style:dashed}
/* trainer */
.trainer{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin:16px 0;overflow:hidden}
.tr-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(90deg,var(--accs),transparent);border-bottom:1px solid var(--line)}
.tr-title{font-weight:750}
.tr-stats{margin-left:auto;display:flex;gap:10px;font-size:14px;align-items:center}
.tr-stats .pill{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.tr-body{padding:14px 16px}
.tr-kind{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}
.tr-task{font-size:16.5px;font-weight:600;margin:4px 0 10px}
.tr-foot{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--soft);align-items:center}
.tr-expl{margin-top:12px}
.hintbox{background:var(--warn);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:15px}
.live{display:inline-flex;gap:8px;align-items:center;background:var(--soft);border-radius:10px;padding:5px 12px;font-variant-numeric:tabular-nums;font-size:15px;margin:6px 6px 0 0}
.live b{font-size:17px}
.inrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.inrow input{width:110px;font:inherit;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.inrow input.ok{border-color:var(--good)}.inrow input.bad{border-color:var(--bad)}
.taskgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.taskgrid{grid-template-columns:1fr}}
/* stepper */
.stepper{margin:14px 0}
.st-side{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.st-count{font-size:12.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.st-text{font-size:16px;margin:6px 0 10px;min-height:70px}
.st-list{font-size:13.5px;color:var(--mut);border-top:1px solid var(--line);padding-top:8px}
.st-list div{padding:3px 6px;border-radius:7px;cursor:pointer}
.st-list div.on{background:var(--accs);color:var(--acc);font-weight:650}
.st-list div.past{color:var(--ink)}
.st-ctrl{display:flex;gap:8px;margin-top:10px}
.st-prog{height:5px;background:var(--soft2);border-radius:9px;overflow:hidden;margin-top:8px}
.st-prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
/* misc */
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:99;transition:all .3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.l5info{position:absolute;left:8px;right:8px;bottom:8px;background:color-mix(in srgb,var(--card) 95%,transparent);border:1.5px solid var(--dd);border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.45;box-shadow:var(--shadow);max-height:58%;overflow:auto;z-index:2}
.l5ih{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:3px}.l5ih .cmut{font-size:12px;white-space:nowrap}
.l5ix{border:0;background:none;font-size:16px;cursor:pointer;color:var(--mut);padding:0 4px}
.l5if{font-size:12.5px;color:var(--mut);margin-top:5px}
.l5fig .hit{stroke:transparent;fill:transparent;stroke-width:16;pointer-events:all;cursor:help}
.l5fig circle.hit{stroke-width:0}
.l5fig svg.dim [data-i]:not(.hx):not(.hit){opacity:.3;transition:opacity .15s}
.l5fig svg line.hx:not(.hit),.l5fig svg circle.hx:not(.hit){filter:drop-shadow(0 0 3px var(--dd)) drop-shadow(0 0 5px var(--dd))}
.l5fig line.hx:not(.hit){stroke:var(--dd)!important;stroke-opacity:1!important}
.l5fig circle.hx:not(.hit){fill:var(--dd)!important}
.l5fig text.hx{fill:var(--ink)!important;font-weight:800;stroke:color-mix(in srgb,var(--dd) 55%,var(--card))!important;stroke-width:5px!important}
.l5info.top{top:8px;bottom:auto}
.l5fig line.bd{stroke:var(--p3);stroke-width:2.6;stroke-dasharray:8 5;fill:none}
.l5fig line.bd.gp{stroke-dasharray:2 3;stroke-width:3.4}
.l5fig line.ck{stroke:var(--nv);stroke-width:2;stroke-dasharray:5 4;fill:none}
.l5fig .pt.bd{fill:var(--p3)}.l5fig .pt.ck{fill:var(--nv)}
.l5fig .lbl.o{fill:var(--p3);font-weight:750}
.l5leg i.gl{border-color:var(--dd)!important;box-shadow:0 0 6px var(--dd)}
.l5why{background:var(--why);border-left:4px solid var(--whyb);border-radius:12px;padding:9px 13px;margin:10px 0;font-size:14.5px;line-height:1.6}
.l5why .t,.l5mem .t,.l5ask .t{font-weight:750;margin-bottom:3px}
.l5mem{background:var(--warn);border-left:4px solid var(--dd);border-radius:12px;padding:9px 13px;margin:10px 0;font-size:14.5px;line-height:1.55}
.l5alt{margin:10px 0}
.l5altb{width:100%;text-align:left;border:1.5px dashed var(--p3);background:transparent;border-radius:10px;padding:8px 11px;font:inherit;font-weight:650;color:var(--ink);cursor:pointer}
.l5altb:hover{background:var(--soft)}
.l5alt.ok .l5altb{border-color:var(--nv)}
.l5alta{border-left:4px solid var(--p3);background:var(--bads);padding:8px 12px;border-radius:0 10px 10px 0;margin-top:6px;font-size:14.5px;line-height:1.55}
.l5alt.ok .l5alta{border-color:var(--nv);background:var(--goods)}
.l5ask{border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin:10px 0;font-size:14.5px}
.l5ask .mini{margin-top:6px}.l5aska{margin-top:6px;padding:7px 10px;background:var(--soft2);border-radius:8px}
.rf{border-bottom:2px dotted var(--dd);cursor:help;font-weight:650;padding:0 2px;border-radius:4px;transition:background .15s}
.rf:hover,.rf.on,.rf:focus{background:color-mix(in srgb,var(--dd) 30%,transparent);outline:none}
button.rf.cam{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:7px;padding:0 6px;font:inherit;font-weight:650;cursor:pointer}
button.rf.cam:hover{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.l5kbd{font-size:12px;color:var(--mut);margin-top:8px}
.l5lab{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.l5lab label{font-weight:700;font-size:14px;display:block}.l5lab input{width:100%;accent-color:var(--teal)}.l5labr{font-size:13.5px;color:var(--mut);line-height:1.45}
.l5abc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:6px 0 12px}
.l5abc summary{cursor:pointer;font-weight:750}
.l5abc-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-top:10px}
.l5abc-c{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px;line-height:1.45;background:var(--soft)}
.l5abc-c svg{display:block;width:100%;height:84px;margin-bottom:4px}
.l5abc-c b{display:block;margin-bottom:2px}
</style></head><body>

<script>'use strict';
/* ===================== утилиты ===================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild;}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rndf=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const deg=r=>r*180/Math.PI, rad=d=>d*Math.PI/180;
const fmt=(n,d=1)=>{let s=(Math.round(n*10**d)/10**d).toFixed(d);if(s.includes('.'))s=s.replace(/0+$/,'').replace(/\.$/,'');return s.replace('.',',').replace('-','−')};
const V={
 add:(a,b)=>a.map((x,i)=>x+b[i]), sub:(a,b)=>a.map((x,i)=>x-b[i]), mul:(a,s)=>a.map(x=>x*s),
 dot:(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0), len:a=>Math.hypot(...a), norm:a=>{const l=Math.hypot(...a)||1;return a.map(x=>x/l)},
 lerp:(a,b,t)=>a.map((x,i)=>x+(b[i]-x)*t), cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
 perp:a=>[-a[1],a[0]], dist:(a,b)=>Math.hypot(...a.map((x,i)=>x-b[i]))
};
/* проекции: x — влево, y — к нам, z — вверх.  Эпюр: u вправо, v вверх */
const P1=p=>[-p[0],-p[1]], P2=p=>[-p[0],p[2]], P3=p=>[p[1],p[2]];
const PR={1:P1,2:P2,3:P3};
const SUB=['₀','₁','₂','₃'];
function lx(a,b,c,d){const r=V.sub(b,a),s=V.sub(d,c),den=r[0]*s[1]-r[1]*s[0];if(Math.abs(den)<1e-9)return null;const q=V.sub(c,a);const t=(q[0]*s[1]-q[1]*s[0])/den,u=(q[0]*r[1]-q[1]*r[0])/den;return{p:V.add(a,V.mul(r,t)),t,u};}
function distPtLine(p,a,b){const d=V.sub(b,a),l=V.len(d);return Math.abs((p[0]-a[0])*d[1]-(p[1]-a[1])*d[0])/l;}
function inR(p,lo=3,hi=57){return p.every(c=>c>=lo&&c<=hi)}

/* ===================== хранилище, опыт ===================== */
const Store=(()=>{let d={};try{d=JSON.parse(localStorage.getItem('ng_trainer_v1')||'{}')}catch(e){}
 const save=()=>{try{localStorage.setItem('ng_trainer_v1',JSON.stringify(d))}catch(e){}};
 return{get:(k,def)=>(k in d?d[k]:def),set:(k,v)=>{d[k]=v;save()},reset:()=>{d={};save()}};})();
const LEVELS=[[0,'Новичок'],[60,'Видит тени'],[160,'Друг эпюра'],[320,'Мастер линий связи'],[520,'Укротитель прямых'],[800,'Повелитель треугольников'],[1150,'Знаток плоскостей'],[1600,'Гроза конкурирующих точек'],[2200,'Готов к зачёту'],[3000,'Монж одобряет']];
function lvlOf(xp){let i=0;while(i<LEVELS.length-1&&xp>=LEVELS[i+1][0])i++;const lo=LEVELS[i][0],hi=(LEVELS[i+1]||[lo+1000])[0];return{i,name:LEVELS[i][1],p:(xp-lo)/(hi-lo)};}
function updateXP(anim){const xp=Store.get('xp',0),L=lvlOf(xp),b=$('#xp');if(!b)return;
 b.innerHTML=`<span class="lv">ур. ${L.i+1}</span><span>${L.name}</span><span class="bar"><i style="width:${Math.round(L.p*100)}%"></i></span><b>${xp} XP</b>`;
 if(anim){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');}}
function addXP(n){const before=lvlOf(Store.get('xp',0)).i;Store.set('xp',Store.get('xp',0)+n);updateXP(true);const after=lvlOf(Store.get('xp',0));if(after.i>before){toast('Новый уровень: '+after.name);confetti();}}
let toastT;function toast(t){const e=$('#toast');e.innerHTML=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600);}
function confetti(){const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext('2d');const cols=['#656565','#676767','#7b7b7b','#6c6c6c','#9f9f9f','#656565'];const ps=[...Array(120)].map(()=>({x:W/2+rndf(-80,80),y:H*0.35,vx:rndf(-7,7),vy:rndf(-12,-3),c:pick(cols),r:rndf(3,6),a:rndf(0,6)}));let f=0;(function step(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.35;p.a+=0.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore();});if(++f<110)requestAnimationFrame(step);else c.remove();})();}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();}

/* ===================== вопрос с вариантами ===================== */
function mcq(host,o){
 const box=el(`<div class="mcq"><div class="q">${o.q}</div><div class="opts"></div><div class="fb"></div></div>`);
 if(o.cols)box.querySelector('.opts').style.gridTemplateColumns=`repeat(${o.cols},minmax(0,1fr))`;
 const list=o.noShuffle?o.opts:shuffle(o.opts);let done=false;const btns=[];
 list.forEach(op=>{const b=el(`<button class="opt">${op.t}</button>`);btns.push([b,op]);
  b.onclick=()=>{if(done)return;done=true;b.classList.add(op.ok?'ok':'bad');
   btns.forEach(([bb,oo])=>{bb.classList.add('dis');if(!op.ok&&oo.ok)bb.classList.add('ghostok');});
   const right=list.find(x=>x.ok);
   let h=`<div class="box ${op.ok?'ok':'bad'}">${op.ok?'<b>✓ Верно!</b> ':'<b>✗ Не совсем.</b> '}${op.why||''}`;
   if(!op.ok&&right)h+=`<div style="margin-top:6px">Правильно: <b>${right.t}</b>${right.why?' — '+right.why:''}</div>`;
   h+='</div>';box.querySelector('.fb').innerHTML=h;
   o.onAnswer&&o.onAnswer(op.ok,op);};
  box.querySelector('.opts').appendChild(b);});
 host.appendChild(box);return box;
}
/* «предскажи → посмотри» */
function predict(host,o){
 const w=el(`<div class="hook"><div class="t">Сначала предскажи</div></div>`);host.appendChild(w);
 mcq(w,{q:o.q,opts:o.opts,noShuffle:o.noShuffle,onAnswer:(ok)=>{if(o.reveal){const r=el(`<div style="margin-top:10px">${o.reveal}</div>`);w.appendChild(r);}o.onAnswer&&o.onAnswer(ok);}});
 return w;
}
/* отметь все верные */
function multi(host,o){
 const box=el(`<div class="mcq"><div class="q">${o.q}</div><div class="ms"></div><button class="btn sm">Проверить</button><div class="fb"></div></div>`);
 const items=shuffle(o.items);const rows=items.map(it=>{const r=el(`<label class="chk"><input type="checkbox"><span>${it.t}</span></label>`);box.querySelector('.ms').appendChild(r);return[r,it];});
 box.querySelector('button').onclick=function(){this.disabled=true;let good=true;rows.forEach(([r,it])=>{const c=r.querySelector('input').checked;r.querySelector('input').disabled=true;
  if(c&&it.ok)r.classList.add('ok');else if(c&&!it.ok){r.classList.add('bad');good=false}else if(!c&&it.ok){r.classList.add('miss');good=false}});
  box.querySelector('.fb').innerHTML=`<div class="box ${good?'ok':'bad'}">${good?'<b>✓ Всё верно!</b>':'<b>✗ Есть ошибки.</b> Контрастные — верные, пунктир — верные, которые ты пропустил, бледные — лишние.'} ${o.why||''}</div>`;
  o.onAnswer&&o.onAnswer(good);};
 host.appendChild(box);return box;
}
/* ввод числа */
function numIn(host,o){
 const r=el(`<div class="mcq"><div class="q">${o.q}</div><div class="inrow"><input type="text" inputmode="decimal" placeholder="${o.ph||'число'}"><span>${o.unit||''}</span><button class="btn sm">Проверить</button></div><div class="fb"></div></div>`);
 const inp=r.querySelector('input'),b=r.querySelector('button');
 const go=()=>{const v=parseFloat(inp.value.replace(',','.').replace('−','-'));if(isNaN(v)){inp.focus();return;}b.disabled=true;inp.disabled=true;const ok=Math.abs(v-o.ans)<=(o.tol??0.6);inp.classList.add(ok?'ok':'bad');
  r.querySelector('.fb').innerHTML=`<div class="box ${ok?'ok':'bad'}">${ok?'<b>✓ Верно!</b> ':'<b>✗ Мимо.</b> Правильно: <b>'+fmt(o.ans,o.dp??1)+(o.unit||'')+'</b>. '}${o.why||''}</div>`;o.onAnswer&&o.onAnswer(ok);};
 b.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};host.appendChild(r);return r;
}

/* ===================== ЭПЮР (SVG) ===================== */
class Ep{
 constructor(host,o={}){
  this.o=Object.assign({axes:'x',grid:true,maxH:440,box:[-60,-60,8,60]},o);this.box=this.o.box;
  this.wrap=el('<div class="ep"><svg xmlns="http://www.w3.org/2000/svg"></svg></div>');host.appendChild(this.wrap);this.svg=this.wrap.firstChild;
  this.draw=null;this.drag=null;this.onDrag=null;this.onDrop=null;this.k=6;
  const sv=this.svg;
  sv.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-h]');if(!h)return;this.drag=h.getAttribute('data-h');try{sv.setPointerCapture(e.pointerId)}catch(_){ }e.preventDefault();});
  sv.addEventListener('pointermove',e=>{if(!this.drag)return;const p=this.toW(e);this.onDrag&&this.onDrag(this.drag,p);this.render();});
  const up=()=>{if(!this.drag)return;const d=this.drag;this.drag=null;this.onDrop&&this.onDrop(d);this.render();};
  sv.addEventListener('pointerup',up);sv.addEventListener('pointercancel',up);
  new ResizeObserver(()=>this.render()).observe(this.wrap);
 }
 toW(e){const pt=this.svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(this.svg.getScreenCTM().inverse());return[q.x,-q.y];}
 setBox(b){this.box=b;this.render();}
 fit(pts,pad=9,withO=true){let a=1e9,b=1e9,c=-1e9,d=-1e9;const all=withO?pts.concat([[0,0]]):pts;all.forEach(p=>{a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]);});this.box=[a-pad,b-pad,c+pad,d+pad];return this;}
 render(){
  const [u0,v0,u1,v1]=this.box,W=u1-u0,H=v1-v0;const r=this.wrap.getBoundingClientRect();const cw=r.width-14;if(cw<40)return;
  let k=cw/W;if(H*k>this.o.maxH)k=this.o.maxH/H;this.k=k;
  this.svg.setAttribute('viewBox',`${u0} ${-v1} ${W} ${H}`);this.svg.style.width=(W*k)+'px';this.svg.style.height=(H*k)+'px';
  const g=new G(this);g.base();if(this.draw)this.draw(g);this.svg.innerHTML=g.out.join('');

}
class G{
 constructor(ep){this.ep=ep;this.k=ep.k;this.out=[];this.hl=false;this.box=ep.box;}

S('start','Старт','Как устроен этот тренажёр',root=>{
 H(root,`<div class="kicker">Начерталка · Лекции 2–4 + зачёт</div><h1>Понять, а не зазубрить</h1>
 <p class="lead">Лекцию 1 ты понял — значит, у тебя уже есть главный инструмент: <b>точка, три проекции и линии связи</b>. Всё дальнейшее — это та же точка, только её <b>две</b> (прямая) или <b>три</b> (плоскость). Здесь каждая тема собрана так: <b>вопрос «зачем» → модель, которую можно крутить → одно правило → задачи до автоматизма</b>.</p>
 <div class="rule"><div class="t">Вся начерталка в 5 мыслях</div><ol>
 <li><b>Индекс = вид.</b> ₁ — смотрим сверху, ₂ — спереди, ₃ — слева. Любая проекция — просто «как это выглядит с этой стороны».</li>
 <li><b>Параллельно стене → вижу настоящий размер (НВ).</b> Перпендикулярно стене → вижу торец: прямая превращается в <b>точку</b>, плоскость — в <b>линию</b>.</li>
 <li><b>Наклонно → короче.</b> Тень короче НВ. Чтобы вернуть НВ, достраиваем прямоугольный треугольник.</li>
 <li><b>Принадлежность — через линии связи.</b> Точка на прямой → её проекции на проекциях прямой. Точка в плоскости → она на прямой этой плоскости.</li></ol></div>
 <h2>Карта: что откуда берётся</h2><div class="mapg" id="map"></div>
 <h2>Почему тут так много задач (и почему это работает)</h2>
 <div class="grid2"><div class="card"><b>Сначала предскажи</b><p>Перед правилом — вопрос. Мозг лучше запоминает ответ, который сначала пытался угадать (эффект генерации), даже если угадал неверно.</p></div>
 <div class="card"><b>Пример → неполный пример → сам</b><p>Сначала разбор по шагам, потом ты делаешь шаги сам, а тренажёр поправляет. Так учат в лучших интерактивных курсах.</p></div>
 <div class="card"><b>Бесконечные задачи + разбор «почему»</b><p>Каждая задача генерируется заново. После ответа — объяснение именно твоей ошибки. Вспоминать > перечитывать.</p></div>
 <div class="card"><b>Перемешка и интервалы</b><p>В «Миксе» темы идут вперемешку, а тренажёр чаще подсовывает то, где ты ошибаешься. Карточки возвращают забытое через интервалы.</p></div></div>
 <div class="mem"><div class="t">Язык линий (везде одинаковый)</div><span class="c1">П₁, вид сверху — контрастный тон</span> · <span class="c2">П₂, спереди — приглушённый</span> · <span class="c3">П₃, слева — бледный</span> · <span class="cnv">натуральная величина — жирная линия</span> · <span class="cdd">Δ (разность координат) — бледная жирная</span> · <span class="cang">угол / искомое — дуга и подпись</span></div>
 <p class="cmut">Прогресс и опыт сохраняются в этом браузере. Если 3D-модель не помещается — крути её пальцем/мышью, кнопки «спереди / сверху / слева» показывают, что каждая проекция — это просто вид.</p>`);

S('lwhy','Прямая (Л2)','Почему длина «врёт»',root=>{
 H(root,`<div class="kicker">Лекция 2 · шаг 1</div><h1>Прямая = две точки. Но длина врёт</h1>

 sliders(R,[{k:'a',l:'наклон α к полу',min:0,max:90,v:30,u:'°'}],val=>{al=val.a;upd();});upd();
 H(R,`<p>Отрезок стоит параллельно передней стене П₂ — поэтому на П₂ он <span class="cnv">всегда в НВ</span>. А тень на полу меняется.</p>`);

 H(root,`<div class="rule"><div class="t">Одно правило, из которого растёт вся лекция</div><ul><li>Отрезок <b>∥ плоскости</b> → на неё он падает <b>без искажения</b> (НВ). <i>Палка, которую держат горизонтально над столом, отбрасывает тень своей длины.</i></li><li>Отрезок <b>⊥ плоскости</b> → на неё падает <b>точкой</b>.</li><li>Отрезок <b>наклонён</b> → тень <b>короче</b>.</li></ul></div>
 <div class="why"><div class="t">Почему так</div>Луч проецирования перпендикулярен плоскости. Отрезок, его тень и два луча образуют прямоугольную трапецию; если сдвинуть тень вверх до конца A, получится прямоугольный треугольник: гипотенуза — сам отрезок, катет — тень. Катет всегда короче гипотенузы. Запомни этот треугольник — он вернётся в «методе прямоугольного треугольника».</div>
 <p>Отсюда три семьи прямых: <b>общего положения</b> (наклонена ко всем — врёт везде), <b>уровня</b> (∥ одной — на ней правда) и <b>проецирующие</b> (⊥ одной — на ней точка).</p>`);

 segBtns(top,(only||LTK).map(k=>[k,{up:'восходящая',down:'нисходящая',h:'горизонталь h',f:'фронталь f',p:'профильная p',hp:'⊥ П₁',fp:'⊥ П₂',pp:'⊥ П₃'}[k]]),k=>{t=k;upd();},t);upd();}

'use strict';
/* ===================== общие помощники для плоскостей ===================== */
function fitBox(pts,pad=9){let a=1e9,b=1e9,c=-1e9,d=-1e9;pts.concat([[0,0]]).forEach(p=>{a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]);});return[a-pad,b-pad,c+pad,d+pad];}
/* многоугольник сечения куба [0,L]^3 плоскостью n·p=d */
function planePoly(n,d,L=60){const P=[];const cs=[0,L];
 for(let ax=0;ax<3;ax++)for(const u of cs)for(const v of cs){const o=[0,0,0];const i1=(ax+1)%3,i2=(ax+2)%3;o[i1]=u;o[i2]=v;
  if(Math.abs(n[ax])<1e-12){if(Math.abs(n[i1]*u+n[i2]*v-d)<1e-9){const a=o.slice(),b=o.slice();b[ax]=L;P.push(a,b);}continue;}
  const t=(d-n[i1]*u-n[i2]*v)/n[ax];if(t>=-1e-9&&t<=L+1e-9){o[ax]=t;P.push(o);}}
 const Q=[];P.forEach(p=>{if(!Q.some(q=>V.dist(p,q)<1e-6))Q.push(p);});if(Q.length<3)return null;
 const c=Q.reduce((a,b)=>V.add(a,b),[0,0,0]).map(x=>x/Q.length);const nn=V.norm(n);let u=V.cross(nn,[0,0,1]);if(V.len(u)<.1)u=V.cross(nn,[1,0,0]);u=V.norm(u);const w=V.cross(nn,u);
 return Q.sort((p,q)=>Math.atan2(V.dot(V.sub(p,c),w),V.dot(V.sub(p,c),u))-Math.atan2(V.dot(V.sub(q,c),w),V.dot(V.sub(q,c),u)));}
/* отрезок прямой a·u+b·v=d внутри квадрата [0,L]^2 */
function clip2(a,b,d,L=60){if(Math.abs(a)<1e-12&&Math.abs(b)<1e-12)return null;const P=[];
 [[0,null],[L,null],[null,0],[null,L]].forEach(([u,v])=>{if(u!==null){if(Math.abs(b)<1e-12)return;const vv=(d-a*u)/b;if(vv>=-1e-9&&vv<=L+1e-9)P.push([u,vv]);}else{if(Math.abs(a)<1e-12)return;const uu=(d-b*v)/a;if(uu>=-1e-9&&uu<=L+1e-9)P.push([uu,v]);}});
 const Q=[];P.forEach(p=>{if(!Q.some(q=>V.dist(p,q)<1e-6))Q.push(p);});if(Q.length<2)return null;let best=[Q[0],Q[1]],bd=0;Q.forEach(p=>Q.forEach(q=>{const dd=V.dist(p,q);if(dd>bd){bd=dd;best=[p,q];}}));return bd<1e-6?null:best;}
/* три следа плоскости n·p=d: возвращает {1:[A,B],2:..,3:..} в 3D */
function traces(n,d,L=60){const r={};let s=clip2(n[0],n[1],d,L);if(s)r[1]=s.map(p=>[p[0],p[1],0]);s=clip2(n[0],n[2],d,L);if(s)r[2]=s.map(p=>[p[0],0,p[1]]);s=clip2(n[1],n[2],d,L);if(s)r[3]=s.map(p=>[0,p[0],p[1]]);return r;}
function hLine(n,d,z,L=60){const s=clip2(n[0],n[1],d-n[2]*z,L);return s?s.map(p=>[p[0],p[1],z]):null;}

S('pdef','Плоскость (Л3)','6 способов задать плоскость',root=>{
 H(root,`<div class="kicker">Лекция 3 · шаг 1</div><h1>Как задать плоскость</h1>
 <div class="hook"><div class="t">Главная мысль</div>Плоскость бесконечна — нарисовать её целиком нельзя. Поэтому на чертеже рисуют <b>минимум, по которому она восстанавливается однозначно</b>. И этот минимум всегда сводится к одному: <b>три точки не на одной прямой</b> (табурет на трёх ножках не шатается).</div>`);
 predict(root,{q:'Сколько плоскостей проходит через одну прямую?',opts:[{t:'бесконечно много',ok:true},{t:'одна',ok:false},{t:'ни одной',ok:false}],reveal:'<div class="why"><div class="t">Поэтому нужна «третья точка в стороне»</div>Представь книгу: корешок — прямая, страницы — плоскости. Их бесконечно много. Чтобы выбрать одну страницу, нужна точка <b>не на корешке</b>. Отсюда все 6 способов.</div>'});
 const W=[['1. Три точки','A, B, C не на одной прямой','это и есть «табурет»'],['2. Прямая + точка','a и A ∉ a','2 точки на прямой + A'],['3. Две пересекающиеся','a ∩ b = K','K + по точке на a и b'],['4. Две параллельные','a ∥ b','2 точки на a + 1 на b'],['5. Плоская фигура','△ABC, четырёхугольник…','вершины — точки плоскости'],['6. Следы','Σ₁ и Σ₂ (пересекаются на x)','частный случай способа 3']];
 const g=el('<div class="grid3"></div>');root.appendChild(g);

 H(root,`<div class="why"><div class="t">Зачем столько способов, если всё равно 3 точки?</div>Разные задачи дают плоскость по-разному: в одной — треугольник, в другой — две прямые, в третьей — следы. Ты всегда можешь перейти от одного способа к другому: на любой прямой взять точки, через любые две точки провести прямую.</div>
 <div class="trap"><div class="t">Ловушки</div>Три точки <b>на одной прямой</b> — не задают. Две <b>скрещивающиеся</b> прямые — не задают (плоскости нет вообще). Прямая и точка <b>на ней</b> — не задают.</div>`);
 trainer(root,{title:'Задаёт ли плоскость?',icon:'',gens:[GEN.pdef],onResult:doneAfter('pdef',4)});
});

S('ptraces','Плоскость (Л3)','Следы плоскости',root=>{
 H(root,`<div class="kicker">Лекция 3 · шаг 2</div><h1>Следы: где плоскость «врезается» в стены</h1>
 <div class="hook"><div class="t">Картинка</div>Поставь наклонно лист картона в угол комнаты. Линия, где он касается <b>пола</b>, — <span class="c1">горизонтальный след Σ₁ (h₀)</span>. Где касается <b>передней стены</b> — <span class="c2">фронтальный след Σ₂ (f₀)</span>. Боковой стены — <span class="c3">профильный Σ₃</span>. Точка, где два следа встречаются на оси, — <b>точка схода</b> Σₓ.</div>
 <p>Двигай ползунки: a, b, c — где плоскость пересекает оси x, y, z. Кнопки сверху ставят особые положения. Нажми «разложить в эпюр» — следы лягут на чертёж.</p>`);

  const tr=traces(n,1);[1,2,3].forEach(k=>{if(tr[k])it.push({k:'seg',a:tr[k][0],b:tr[k][1],c:'p'+k,w:3.4,tag:TAG[k],label:'Σ'+SUB[k],lc:'p'+k});});
  if(!inf.a)it.push({k:'pt',p:[st.a,0,0],c:'ink',r:4,label:'Σₓ'});
  const h=hLine(n,1,st.zh);if(h&&(n[0]||n[1])){it.push({k:'seg',a:h[0],b:h[1],c:'nv',w:3,sp:true,label:'h'},{k:'seg',a:prj(h[0],1),b:prj(h[1],1),c:'nv',w:2,tag:'p1',dash:1},{k:'seg',a:prj(h[0],2),b:prj(h[1],2),c:'nv',w:2,dash:1});}
  return it;}});
 const ep=new Ep(g.children[1],{axes:'xyz',maxH:420,box:[-66,-66,66,66]});
 ep.draw=gg=>{const n=nrm(),tr=traces(n,1);
  [1,2,3].forEach(k=>{if(!tr[k])return;const a=PR[k](tr[k][0]),b=PR[k](tr[k][1]);gg.line(a,b,{c:'c'+k,w:3});gg.text(V.lerp(a,b,.5),'Σ'+SUB[k],{c:'c'+k,dx:8,dy:-10});});
  if(!inf.b&&st.b<=60){gg.link([0,-st.b],[st.b,-st.b]);gg.link([st.b,-st.b],[st.b,0]);gg.pt([0,-st.b],'Σy',{c:'ink',lp:[-24,0]});gg.pt([st.b,0],'Σy′',{c:'ink',lp:[4,-12]});}
  if(!inf.a&&st.a<=60)gg.pt([-st.a,0],'Σₓ',{c:'ink',lp:[-8,-13]});if(!inf.c&&st.c<=60)gg.pt([0,st.c],'Σz',{c:'ink',lp:[7,-4]});
  const h=hLine(n,1,st.zh);if(h&&(n[0]||n[1])){[1,2].forEach(k=>{const a=PR[k](h[0]),b=PR[k](h[1]);gg.line(a,b,{c:'nv',w:2.2,dash:1});gg.text(b,'h'+SUB[k],{c:'nv',dx:6,dy:-9});});}};
 const info=box(root);
 const upd=()=>{v.render();ep.render();const z=Object.keys(inf).filter(k=>inf[k]).join('');
  const T={'':'gen',c:'hp',b:'fp',a:'pp',ab:'hl',ac:'fl',bc:'pl'}[z];const W={
   gen:'Все три оси пересечены → все следы наклонные, сходятся попарно на осях. <b>Общее положение.</b> Горизонталь h (выделена) — прямая плоскости на высоте z: обрати внимание, <b>h₁ ∥ Σ₁</b> (ведь Σ₁ — это тоже горизонталь, только на высоте 0), а <b>h₂ ∥ x</b>.',
   hp:'Ось z не пересекается (c = ∞) → плоскость <b>вертикальная, ⊥ П₁</b>. Тогда Σ₂ и Σ₃ — <b>вертикальные</b> линии (⊥ x), а Σ₁ — наклонная, и на неё «падает» сверху вся плоскость (собирательное свойство). Как стена дома, стоящая под углом.',
   fp:'Ось y не пересекается → <b>⊥ П₂</b>. Σ₁ ⊥ x, а Σ₂ наклонный: спереди плоскость видна ребром. Как открытая крышка ноутбука, если смотреть сбоку… то есть спереди.',
   pp:'Ось x не пересекается → <b>⊥ П₃</b> (точки схода Σₓ нет). Σ₁ и Σ₂ — обе <b>∥ x</b>! Скат крыши с коньком вдоль x. Ловушка: на П₁ и П₂ плоскость не «схлопнута», выдаёт её только П₃.',
   hl:'Пересекает только z → <b>горизонтальная плоскость (∥ П₁)</b>, как пол второго этажа. Есть только Σ₂ ∥ x и Σ₃ ∥ y′. Следа на П₁ нет — она с ним не встречается.',
   fl:'Пересекает только y → <b>фронтальная (∥ П₂)</b>, как стена перед тобой. Σ₁ ∥ x, Σ₃ ∥ z. Следа на П₂ нет.',
   pl:'Пересекает только x → <b>профильная (∥ П₃)</b>. Σ₁ и Σ₂ — на одной вертикали, ⊥ x. Следа на П₃ нет.'}[T];
  info.innerHTML=`<div class="why"><div class="t">${PT[T].n}</div>${W}</div>`;};
 segBtns(top,[['gen','общая'],['hp','⊥ П₁'],['fp','⊥ П₂'],['pp','⊥ П₃'],['hl','∥ П₁'],['fl','∥ П₂'],['pl','∥ П₃']],k=>{const p=TRP[k];inf={a:!p[0],b:!p[1],c:!p[2]};if(p[0])st.a=p[0];if(p[1])st.b=p[1];if(p[2])st.c=p[2];upd();},'gen');
 sliders(top,[{k:'a',l:'a — пересечение с x',min:15,max:90,v:50},{k:'b',l:'b — с y',min:15,max:90,v:40},{k:'c',l:'c — с z',min:15,max:90,v:45},{k:'zh',l:'высота горизонтали h',min:2,max:55,v:20}],val=>{Object.assign(st,val);upd();});
 upd();
 H(root,`<div class="rule"><div class="t">Правила следов (выведи их сам из модели)</div><ol>
 <li><b>Σ₁ и Σ₂ всегда сходятся на оси x</b> (в точке Σₓ) — или оба ∥ x. Почему: точка схода лежит и на полу, и на стене, а пол со стеной встречаются только по оси x.</li>
 <li><b>Горизонталь плоскости ∥ Σ₁</b>, фронталь ∥ Σ₂. Почему: Σ₁ — это горизонталь на нулевой высоте; все горизонтали одной плоскости параллельны.</li>
 <li><b>Проецирующая плоскость:</b> один след наклонный (на «своей» П), остальные ⊥ осям. На наклонный след проецируется всё, что лежит в плоскости.</li>
 <li><b>Плоскость уровня:</b> следы только ∥ осям, на «своей» П следа нет.</li></ol></div>
 <div class="mem"><div class="t">Обозначения в разных учебниках</div>Σ₁ = h₀ (горизонтальный след), Σ₂ = f₀ (фронтальный), Σ₃ = p₀. Буквы h и f — потому что след на полу и есть «нулевая горизонталь», а след на стене — «нулевая фронталь».</div>`);
 const q=box(root);const cb=doneAfter('ptraces',3);
 mcq(q,{q:'1) Σ₁ и Σ₂ плоскости общего положения пересекаются…',opts:[{t:'на оси x',ok:true,why:'Общие точки пола и передней стены — только на оси x.'},{t:'в любой точке листа',ok:false},{t:'на оси z',ok:false}],onAnswer:cb});
 mcq(q,{q:'2) У плоскости оба следа Σ₁ и Σ₂ ∥ x. Это…',opts:[{t:'профильно-проецирующая (⊥ П₃)',ok:true,why:'Плоскость не пересекает ось x — она «тянется» вдоль x. Ребром видна только слева.'},{t:'общего положения',ok:false},{t:'горизонтальная',ok:false,why:'У горизонтальной вообще нет Σ₁.'}],onAnswer:cb});
 mcq(q,{q:'3) Горизонталь h плоскости на П₁ параллельна…',opts:[{t:'следу Σ₁',ok:true,why:'Σ₁ — тоже горизонталь (на высоте 0). Горизонтали одной плоскости параллельны.'},{t:'оси x',ok:false,why:'Оси x параллельна h₂, а не h₁.'},{t:'следу Σ₂',ok:false}],onAnswer:cb});

S('ptypes','Плоскость (Л3)','7 положений плоскости',root=>{
 H(root,`<div class="kicker">Лекция 3 · шаг 3</div><h1>Семь положений плоскости — та же логика, что у прямой</h1>
 <div class="hook"><div class="t">Перенос знаний</div>У прямой: ∥ П → НВ; ⊥ П → точка. У плоскости ровно так же: <b>∥ П → фигура в НВ</b>; <b>⊥ П → фигура схлопывается в линию</b> (видна «ребром», как лист бумаги, на который смотришь с торца).</div>`);
 let t='gen',T=genPlaneTri('gen');const top=box(root);const g=el('<div class="grid2"><div></div><div></div></div>');root.appendChild(g);
 const NVK={hl:[1],fl:[2],pl:[3]};
 const v=new View3D(g.children[0],{build:()=>{const it=[...room()];[1,2,3].forEach(k=>{const nv=(NVK[t]||[]).includes(k);it.push({k:'poly',pts:T.map(p=>prj(p,k)),c:nv?'nv':'p'+k,fa:.3,sa:1,w:nv?3:2,tag:TAG[k]});});
  it.push({k:'poly',pts:T,c:'obj',fa:.3,sa:1,w:2.5,sp:true});T.forEach((p,i)=>it.push(...ptb(p,'ABC'[i],{p3:true,nolab:true})));return it;}});
 const ep=new Ep(g.children[1],{axes:'xyz',maxH:400});ep.draw=gg=>drawTri(gg,T,{nv:NVK[t]});
 const info=box(root);
 const upd=()=>{ep.fit(triPts(T),8);ep.render();v.render();info.innerHTML=`<div class="why"><div class="t">${PT[t].n}</div>${PT[t].why}</div>`;};
 const bt=el('<button class="btn ghost sm" style="margin-left:8px">другой пример</button>');
 segBtns(top,PTK.map(k=>[k,{gen:'общая',hp:'⊥ П₁',fp:'⊥ П₂',pp:'⊥ П₃',hl:'∥ П₁',fl:'∥ П₂',pl:'∥ П₃'}[k]]),k=>{t=k;T=genPlaneTri(k)||T;upd();},'gen');top.appendChild(bt);bt.onclick=()=>{T=genPlaneTri(t)||T;upd();};upd();
 H(root,`<table class="tb"><tr><th>Семья</th><th>Кто</th><th>Признак на эпюре</th><th>Где НВ фигуры</th></tr>
 <tr><td><b>Общего положения</b></td><td>—</td><td>все три проекции — треугольники</td><td>нигде</td></tr>
 <tr><td rowspan="3"><b>Проецирующие</b><br><span class="cmut">⊥ одной П</span></td><td>горизонтально-проец. ⊥ П₁</td><td>на П₁ — <b>наклонная линия</b></td><td>нигде*</td></tr>
 <tr><td>фронтально-проец. ⊥ П₂</td><td>на П₂ — наклонная линия</td><td>нигде*</td></tr><tr><td>профильно-проец. ⊥ П₃</td><td>на П₃ — наклонная линия (на П₁, П₂ — треугольники!)</td><td>нигде*</td></tr>
 <tr><td rowspan="3"><b>Уровня</b><br><span class="cmut">∥ одной П</span></td><td>горизонтальная ∥ П₁</td><td>на П₂ — линия <b>∥ x</b></td><td class="cnv">П₁</td></tr>
 <tr><td>фронтальная ∥ П₂</td><td>на П₁ — линия ∥ x</td><td class="cnv">П₂</td></tr><tr><td>профильная ∥ П₃</td><td>на П₁ и П₂ — вертикальные линии</td><td class="cnv">П₃</td></tr></table>
 <p class="cmut">* Зато на «схлопнутой» проекции сразу виден угол наклона плоскости к двум другим плоскостям проекций.</p>
 <div class="why"><div class="t">Почему плоскость уровня — это «дважды проецирующая»</div>Горизонтальная плоскость ∥ П₁ — она же ⊥ П₂ и ⊥ П₃. Поэтому на П₂ и П₃ она линия (∥ осям), а на П₁ — НВ. Проецирующая плоскость наклонена: на одной П — <b>наклонная</b> линия. Наклонная линия → проецирующая; линия ∥ оси → уровня.</div>
 <div class="rule"><div class="t">Собирательное свойство (самое полезное!)</div>Если плоскость ⊥ П₁, то <b>всё</b>, что в ней лежит (точки, прямые, фигуры), на П₁ попадает на одну линию — её след Σ₁. Поэтому задачи с проецирующими плоскостями решаются «бесплатно»: одна проекция уже известна.</div>
 <div class="mem"><div class="t">Алгоритм «3 секунды»</div>1) Есть проекция-<b>линия</b>? Нет → общего положения. 2) Линия <b>∥ оси</b>? Да → уровня (НВ на другой проекции). Нет (наклонная) → проецирующая, ⊥ той П, где линия. 3) Не забудь глянуть на П₃!</div>`);
 trainer(root,{title:'Положение плоскости',icon:'',gens:[GEN.ptype],onResult:doneAfter('ptypes',4)});
});

 predict(root,{q:'Сверху точки 1 и 2 слились. Какая прямая видна на П₁ в этом месте?',opts:[{t:'a — точка 1 выше',ok:true},{t:'b',ok:false},{t:'обе одинаково',ok:false}],reveal:'<div class="why"><div class="t">Как это узнать по эпюру</div>Смотрим сверху → кто <b>выше</b>, тот и виден. Высота видна на <b>П₂</b>: опускаем… точнее поднимаем линию связи от 1₁≡2₁ на П₂ и видим, что 1₂ выше 2₂. Значит видна a, а b на П₁ уходит «под» неё (на чертеже — разрыв).</div>'});

S('rcut','Взаимное положение (Л4)','Пересечение с проецирующей плоскостью',root=>{
 H(root,`<div class="kicker">Лекция 4 · шаг 6</div><h1>Плоскость общего положения ∩ проецирующая плоскость</h1>
 <div class="hook"><div class="t">Картинка</div>Режем наклонный лист вертикальным ножом. Нож — плоскость Σ ⊥ П₁. Сверху нож виден <b>линией</b> (след Σ₁). Линия разреза лежит в ноже → сверху она тоже на этой линии. <b>Половина ответа известна бесплатно!</b></div>
 <div class="rule"><div class="t">Алгоритм</div><ol><li><b>l₁ ≡ Σ₁</b> (собирательное свойство: всё в Σ проецируется на след).</li><li>Отмечаем точки 1₁, 2₁, где Σ₁ пересекает стороны треугольника.</li><li>Переносим 1 и 2 по линиям связи на те же стороны на П₂ (это «прямая в плоскости»).</li><li>1₂2₂ = l₂. Готово.</li></ol>Для Σ ⊥ П₂ — то же самое, только начинаем с П₂: l₂ ≡ Σ₂.</div>
 <div class="why"><div class="t">Почему это важно</div>Это ключ к пересечению двух плоскостей общего положения и прямой с плоскостью (следующие лекции): там через прямую проводят вспомогательную проецирующую плоскость — и задача сводится к этой.</div>`);

 <tr><td>общего положения</td><td>проекции наклонны к x</td><td>метод △</td><td>метод △</td></tr>
 <tr><td>горизонталь h ∥ П₁</td><td>h₂ ∥ x</td><td>П₁</td><td>β на П₁ (h₁ с x)</td></tr><tr><td>фронталь f ∥ П₂</td><td>f₁ ∥ x</td><td>П₂</td><td>α на П₂ (f₂ с x)</td></tr>
 <tr><td>профильная p ∥ П₃</td><td>p₁, p₂ ⊥ x</td><td>П₃</td><td>α, β на П₃</td></tr><tr><td>⊥ П₁</td><td>A₁ ≡ B₁</td><td>П₂, П₃</td><td>α = 90°</td></tr><tr><td>⊥ П₂</td><td>A₂ ≡ B₂</td><td>П₁, П₃</td><td>β = 90°</td></tr><tr><td>⊥ П₃</td><td>обе ∥ x</td><td>П₁, П₂</td><td>γ = 90°</td></tr></table>
 <h2>Метод прямоугольного треугольника</h2><div class="rule">Катет 1 — проекция отрезка; катет 2 — <b>Δ потерянной координаты</b> (для П₁ — Δz, для П₂ — Δy, для П₃ — Δx), берётся с другой проекции. Гипотенуза = НВ. Угол между проекцией и гипотенузой = угол прямой с этой П (α, β, γ).<br><b>Обратная тип 1:</b> 2 решения (Δ вверх/вниз). <b>Тип 2:</b> вспомогательный △ (катет Δy, угол β) даёт длину A₂B₂ → дуга циркулем из A₂ до линии связи: 2, 1 или 0 решений.<br><b>Дана длина |AB|:</b> ⊥ к данной проекции в A, засечка циркулем радиусом |AB| из B → второй катет = Δ → откладываем от уровня A вверх и вниз: 2 решения.</div>
 <h2>Плоскость</h2><table class="tb"><tr><th>Тип</th><th>Признак</th><th>Следы</th></tr>
 <tr><td>общего положения</td><td>все проекции — фигуры</td><td>все наклонные, сходятся на осях</td></tr>
 <tr><td>⊥ П₁</td><td>на П₁ наклонная линия</td><td>Σ₁ наклонный, Σ₂ ⊥ x</td></tr><tr><td>⊥ П₂</td><td>на П₂ наклонная линия</td><td>Σ₂ наклонный, Σ₁ ⊥ x</td></tr><tr><td>⊥ П₃</td><td>на П₃ наклонная линия</td><td>Σ₁ ∥ x, Σ₂ ∥ x</td></tr>
 <tr><td>∥ П₁</td><td>на П₂ линия ∥ x</td><td>только Σ₂ ∥ x (и Σ₃)</td></tr><tr><td>∥ П₂</td><td>на П₁ линия ∥ x</td><td>только Σ₁ ∥ x (и Σ₃)</td></tr><tr><td>∥ П₃</td><td>на П₁, П₂ вертикали</td><td>Σ₁, Σ₂ ⊥ x</td></tr></table>
 <h2>Взаимное положение</h2><div class="grid2"><div class="rule"><b>Точка ∈ прямой:</b> M₁ ∈ a₁ и M₂ ∈ a₂ (кроме профильной — проверяй П₃).<br><b>Прямые ∥:</b> a₁ ∥ b₁, a₂ ∥ b₂.<br><b>∩:</b> K₁ и K₂ на одной линии связи.<br><b>Скрещиваются:</b> иначе.</div>

 <div class="rule"><b>∩ с проецирующей Σ ⊥ П₁:</b> l₁ ≡ Σ₁, точки на сторонах → на П₂.<br><b>Плоскости ∥:</b> две пересекающиеся ∥ двум пересекающимся; Σ₁∥Γ₁, Σ₂∥Γ₂; h₁∥h′₁, f₂∥f′₂.</div></div>
 <div class="mem"><div class="t">Совет</div>Шпаргалка полезна <b>после</b> попытки вспомнить. Закрой страницу, напиши на листке всё, что помнишь, и только потом сверься — это в 2–3 раза эффективнее перечитывания.</div>`);

   v2 · ЧАСТЬ 1. Анимация 3D, демонстрация «задаёт ли плоскость?»

function anim3d(v){if(v._anim)return;v._anim=1;v.time=v.time||0;const born=performance.now();let last=born;
 const loop=now=>{const dt=Math.min(60,now-last);last=now;
  if(!v.root.isConnected){if(now-born>3000){v._anim=0;return;}requestAnimationFrame(loop);return;}
  if(v.root.offsetParent!==null&&!v.paused){v.time+=dt/1000;v.render();}requestAnimationFrame(loop);};

   q:{q:`Куда откладываем z = ${z}?`,opts:[{t:'вверх от оси x по линии связи',ok:true},{t:'вниз',ok:false},{t:'вправо',ok:false}]},chk:{type:'num',q:'Расстояние от A₂ до оси x (мм)?',ans:z,tol:.5,unit:' мм'},
   d:g=>{g.line([-x,0],P2(A),{c:'c2',w:2.4});g.pt(P2(A),'A₂',{c:'c2',lp:[8,-10]});}},
  {s:'A₃ через 45°',t:'Из A₁ — горизонталь до прямой 45°, затем вертикально вверх; из A₂ — горизонталь вправо. Пересечение — <b>A₃(y; z)</b>.',why:'Прямая 45° лишь «поворачивает» глубину y с вертикальной оси y на горизонтальную y′ — величина сохраняется. Можно и дугой циркуля из O.',
   q:{q:'A₃ лежит на одной горизонтали с…',opts:[{t:'A₂ (общий z)',ok:true},{t:'A₁',ok:false,why:'у A₁ и A₃ общий y, но он переносится через 45°'},{t:'ни с кем',ok:false}]},chk:{type:'num',q:'Расстояние от A₃ до оси z (мм)?',ans:y,tol:.5,unit:' мм'},
   d:g=>{g.link(P1(A),[y,-y]);g.link([y,-y],P3(A));g.link(P2(A),P3(A));g.pt(P3(A),'A₃',{c:'c3',lp:[8,-10]});}},
  {s:'Проверка',t:`Читаем эпюр: A₁(${x}; ${y}) · A₂(${x}; ${z}) · A₃(${y}; ${z}). ${sp}`,mem:'Каждая проекция теряет одну координату — ту, вдоль которой смотрим.'}],
  answer:`A₁(${x}; ${y}), A₂(${x}; ${z}), A₃(${y}; ${z})`};}};
/* ---------- 1. тип прямой ---------- */
WE.ltype={id:'ltype',topic:'line',icon:'',t:'Тип прямой: алгоритм «5 секунд»',make(){const type=pick(LTK);const[A,B]=genLine(type);const F=lineFacts(A,B);const P=PROPK;
 const st=[{s:'Смотрим',t:'Перед нами A₁B₁ и A₂B₂. Идём по алгоритму «5 секунд»: <b>точка? → ∥ x? → одна вертикаль? → наклон</b>. Отвечаем на первый вопрос, где ответ «да», — и стоп.'}];
 const pt=type==='hp'?1:type==='fp'?2:0;
 st.push({s:'Есть точка?',t:pt?`Да: A${SUB[pt]} ≡ B${SUB[pt]} — проекция-<b>точка</b> → прямая ⊥ П${SUB[pt]} (смотрим ей «в торец»).`:'Нет: обе проекции — отрезки.',why:'Прямая видна точкой, только если смотреть строго вдоль неё → она перпендикулярна этой плоскости проекций.',
  q:{q:'Есть ли проекция-точка?',opts:[{t:'да, на П₁',ok:pt===1},{t:'да, на П₂',ok:pt===2},{t:'нет',ok:!pt}]},d:g=>drawProp(g,F,P[pt===2?'pt2':'pt1'])});
 if(!pt){const p1=F.dy===0,p2=F.dz===0;
  st.push({s:'∥ оси x?',t:p1&&p2?'<b>Обе</b> проекции ∥ x → одинаковые y и z → прямая вдоль x → <b>⊥ П₃</b>.':p2?'<b>A₂B₂ ∥ x</b> → одинаковая высота → <b>горизонталь</b> (НВ на П₁). Крест-накрест: h₂ ∥ x → НВ на П₁.':p1?'<b>A₁B₁ ∥ x</b> → одинаковая глубина → <b>фронталь</b> (НВ на П₂).':'Ни одна не ∥ x (пунктиры-эталоны расходятся с проекциями).',
   why:'Проекция ∥ x означает, что потерянная другой проекцией координата одинакова у концов: A₂B₂ ∥ x ⇔ z<sub>A</sub> = z<sub>B</sub>.',
   q:{q:'Какие проекции ∥ оси x?',opts:[{t:'только A₂B₂',ok:p2&&!p1},{t:'только A₁B₁',ok:p1&&!p2},{t:'обе',ok:p1&&p2},{t:'ни одна',ok:!p1&&!p2}]},d:g=>{drawProp(g,F,P.par1);drawProp(g,F,P.par2);}});
  if(!p1&&!p2){const pr=F.dx===0;st.push({s:'Одна вертикаль?',t:pr?'Да: концы на <b>одной линии связи</b> → одинаковый x → <b>профильная</b> (НВ на П₃).':'Нет: концы на разных линиях связи.',
    q:{q:'Лежат ли обе проекции на одной линии связи?',opts:yn(pr)},d:g=>drawProp(g,F,P.perp1)});
   if(!pr)st.push({s:'Наклон',t:`Общего положения. Дальний конец (на П₁ ближе к оси x) — ${type==='up'?'<b>выше</b> на П₂ → наклоны в одну сторону → <b>восходящая</b>':'<b>ниже</b> на П₂ → наклоны в разные стороны → <b>нисходящая</b>'}.`,why:'«Восходящая» — уходя от нас (y уменьшается), прямая поднимается. На П₁ дальний конец ближе к оси x, т. е. выше на листе; если он и на П₂ выше — обе проекции «смотрят» в одну сторону.',
    q:{q:'Проекции наклонены…',opts:[{t:'в одну сторону — восходящая',ok:type==='up'},{t:'в разные стороны — нисходящая',ok:type==='down'}]},d:g=>drawProp(g,F,P.up)});}}
 st.push({s:'Вывод',t:`<b>${LT[type].n}</b>. ${LT[type].why}`,chk:{type:'mcq',q:'Итак, прямая:',opts:LTK.map(k=>({t:LT[k].n,ok:k===type}))},d:g=>{}});
 return{title:'Определить положение прямой по эпюру',given:`A(${A.join('; ')}), B(${B.join('; ')}) — эпюр слева`,task:'тип прямой и где НВ',axes:'x',pts:segPts(A,B),base:g=>drawSeg2(g,A,B,{nv:null}),steps:st,answer:`${LT[type].n}; НВ — ${LT[type].nv.length?LT[type].nv.map(k=>'П'+SUB[k]).join(' и '):'нигде (метод треугольника)'}`};}};
/* ---------- 2. метод треугольника ---------- */
WE.tri1={id:'tri1',topic:'tri',icon:'',t:'НВ и α (треугольник на П₁)',make(){const[A,B]=genGeneral(10);const T=triSteps(A,B,1);
 return{title:'НВ отрезка и угол α — треугольник на П₁',given:'эпюр отрезка AB (A₁B₁ и A₂B₂) — слева, без координат',task:'|AB| и α = ∠(AB, П₁)',axes:'x',pts:segPts(A,B).concat([T.B0]),base:g=>drawSeg2(g,A,B),steps:[wAnal(T.F)].concat(T.steps),answer:'|AB| = |A₁B₀|; α = ∠(A₁B₁, A₁B₀)'};}};
WE.tri2={id:'tri2',topic:'tri',icon:'',t:'НВ и β (треугольник на П₂)',make(){const[A,B]=genGeneral(10);const T=triSteps(A,B,2);
 return{title:'НВ отрезка и угол β — треугольник на П₂',given:'эпюр отрезка AB (A₁B₁ и A₂B₂) — слева, без координат',task:'|AB| и β = ∠(AB, П₂)',axes:'x',pts:segPts(A,B).concat([T.B0]),base:g=>drawSeg2(g,A,B),steps:[wAnal(T.F)].concat(T.steps),answer:'|AB| = |A₂B₀|; β = ∠(A₂B₂, A₂B₀)'};}};
let _tri12first=true;
WE.tri12={id:'tri12',topic:'tri',icon:'',t:'НВ, α и β + самопроверка',make(){let A,B;if(_tri12first){_tri12first=false;A=[45,10,12];B=[15,30,38];}else[A,B]=genGeneral(10);const T1=triSteps(A,B,1),T2=triSteps(A,B,2,'′');const L=T1.F.L;
 return{title:'Полная задача: НВ, α и β (как на зачёте)',given:'эпюр отрезка AB (A₁B₁ и A₂B₂) — слева, без координат',task:'|AB|, α, β',axes:'x',pts:segPts(A,B).concat([T1.B0,T2.B0]),base:g=>drawSeg2(g,A,B),
  steps:[wAnal(T1.F)].concat(T1.steps,T2.steps,[{s:'Самопроверка',t:'Две гипотенузы — A₁B₀ и A₂B₀′ — должны быть <b class="cnv">одинаковой длины</b> (проверь циркулем): это одна и та же НВ ✓.',why:'Если гипотенузы получились разной длины — где-то перепутан катет (чаще всего взяли «чужую» Δ).',mem:'Бесплатная проверка на зачёте: НВ из двух треугольников обязана совпасть.'}]),answer:'|AB| = |A₁B₀| = |A₂B₀′|; α = ∠(A₁B₁, A₁B₀); β = ∠(A₂B₂, A₂B₀′)'};}};
WE.tri3={id:'tri3',topic:'tri',icon:'',t:'Угол γ (треугольник на П₃, Δx)',make(){let A,B;for(let i=0;i<300;i++){[A,B]=genGeneral(10);if(Math.abs(A[0]-B[0])>=14&&Math.abs(A[1]-B[1])>=10&&Math.abs(A[2]-B[2])>=10)break;}const T=triSteps(A,B,3);
 return{title:'Угол γ к П₃ — треугольник на профильной проекции',given:'эпюр отрезка AB (A₁B₁ и A₂B₂) — слева, без координат',task:'|AB| и γ = ∠(AB, П₃)',axes:'xyz',pts:segPts(A,B,true).concat([T.B0]),base:g=>drawSeg2(g,A,B),
  steps:[wAnal(T.F),{s:'Строим П₃',t:'Для γ (наклон к П₃) нужна проекция на П₃. Строим A₃ и B₃: от A₂, B₂ — горизонтали вправо; от A₁, B₁ — горизонтали до прямой 45° и вверх.',why:'A₃(y; z): высоту берём с П₂, глубину — с П₁ и переносим через 45°.',
   q:{q:'На какой проекции строим треугольник для γ?',opts:[{t:'A₃B₃',ok:true,why:'угол к П₃ → проекция на П₃'},{t:'A₁B₁',ok:false,why:'это для α'},{t:'A₂B₂',ok:false,why:'это для β'}]},d:g=>drawP3(g,A,B)}].concat(T.steps),answer:'|AB| = |A₃B₀|; γ = ∠(A₃B₃, A₃B₀)'};}};
WE.prof={id:'prof',topic:'tri',icon:'',t:'Профильная прямая (как задача 3 из ДЗ)',make(){let A,B;for(let i=0;i<300;i++){const x=rnd(15,45);A=[x,rnd(6,50),rnd(6,50)];B=[x,rnd(6,50),rnd(6,50)];if(Math.abs(A[1]-B[1])>=12&&Math.abs(A[2]-B[2])>=12)break;}
 const F=lineFacts(A,B),a3=P3(A),b3=P3(B),sx=Math.sign(b3[0]-a3[0]),sy=Math.sign(b3[1]-a3[1]);
 return{title:'Профильная прямая: НВ и углы α, β, γ',given:'эпюр отрезка AB (A₁B₁ и A₂B₂) — слева, без координат',task:'|AB|, α, β, γ',axes:'xyz',pts:segPts(A,B,true),base:g=>drawSeg2(g,A,B),
  steps:[{s:'Анализ',t:`A₁B₁ и A₂B₂ на <b>одной линии связи</b> → <b>профильная прямая p ∥ П₃</b>. На П₁ и П₂ она искажена, НВ — только на П₃.`,why:'Одинаковый x — все точки прямой на одном расстоянии от П₃ → прямая ∥ П₃. Ловушка: её проекции на П₁ и П₂ выглядят «вертикальными», и по ним ни длину, ни углы не видно.',d:g=>drawProp(g,F,PROPK.perp1)},
  {s:'Строим П₃',t:'Достраиваем A₃ и B₃ по линиям связи и прямой 45°.',q:{q:'Где профильная прямая видна в НВ?',opts:[{t:'на П₃',ok:true},{t:'на П₁',ok:false},{t:'на П₂',ok:false},{t:'нигде — нужен треугольник',ok:false,why:'можно и треугольником, но НВ уже есть на П₃ бесплатно'}]},d:g=>drawP3(g,A,B)},
  {s:'НВ',t:'A₃B₃ — <b class="cnv">НВ</b>: прямая ∥ П₃, поэтому на П₃ она не искажается.',q:{q:'Что видно на П₃ без искажения?',opts:[{t:'длина AB и углы α, β',ok:true},{t:'только длина',ok:false,why:'углы с П₁ и П₂ тоже видны: пол и стена на П₃ видны линиями'},{t:'ничего',ok:false}]},d:g=>{g.line(a3,b3,{c:'nv',w:3.8});g.dim(a3,b3,'НВ',{c:'nv',dy:-12});}},
  {s:'Угол α',t:`На П₃ пол П₁ виден <b>горизонталью</b> (ось y′). Угол A₃B₃ с горизонталью — это и есть <b class="cang">α</b>.`,why:'Прямая ∥ П₃ → на П₃ без искажений видны длина и углы с П₁ и П₂. На виде слева пол — горизонтальная линия y′, передняя стена — вертикаль z.',
   q:{q:'С чем на П₃ сравниваем A₃B₃, чтобы получить α?',opts:[{t:'с горизонталью (ось y′)',ok:true},{t:'с вертикалью (ось z)',ok:false,why:'это даст β'},{t:'с осью x',ok:false}]},
   d:g=>{g.inf(a3,[a3[0]+1,a3[1]],{c:'acc',w:1.1,dash:1});g.arc(a3,[a3[0]+sx*10,a3[1]],b3,30,{label:'α'});}},
  {s:'Угол β',t:`Стена П₂ на П₃ видна <b>вертикалью</b> (ось z). Угол A₃B₃ с вертикалью — это <b class="cang">β</b>. Проверка: α и β дополняют друг друга до прямого угла — у профильной всегда.`,
   d:g=>{g.inf(a3,[a3[0],a3[1]+1],{c:'acc',w:1.1,dash:1});g.arc(a3,[a3[0],a3[1]+sy*10],b3,46,{label:'β',c:'p2'});}},
  {s:'Угол γ',t:'<b>γ = 0°</b>: прямая ∥ П₃.',q:{q:'Чему равен γ?',opts:[{t:'0°',ok:true},{t:'90°',ok:false},{t:'α + β',ok:false}]},mem:'В ДЗ задачи 3, 6, 9, 12 — профильные прямые. Всё берётся с П₃: НВ, α (с горизонталью), β (с вертикалью), γ = 0°.'}],
  answer:'НВ = A₃B₃; α — угол A₃B₃ с горизонталью; β — с вертикалью; γ = 0°'};}};
/* ---------- 3. обратные задачи ---------- */
WE.inv1={id:'inv1',topic:'tri',icon:'↩',t:'Обратная · тип 1 (два решения)',make(){const k=pick([1,2]),idx=k===1?2:1,o=3-k,G=GR[k],s=SUB[k],so=SUB[o],c=DN[k];let A,B,ang,D,pj;
 for(let it=0;it<3000;it++){A=[rnd(12,50),rnd(16,42),rnd(16,42)];B=[rnd(8,52),rnd(6,52),rnd(6,52)];if(Math.abs(A[0]-B[0])<12)continue;pj=V.dist(PR[k](A),PR[k](B));if(pj<16)continue;ang=rnd(20,50);D=pj*Math.tan(rad(ang));if(D<6||A[idx]-D<4||A[idx]+D>56)continue;break;}
 const ak=PR[k](A),bk=PR[k](B),ao=PR[o](A),n=nrmK(ak,bk,k),B0=V.add(bk,V.mul(n,D));const Bp=B.slice(),Bm=B.slice();Bp[idx]=A[idx]+D;Bm[idx]=A[idx]-D;const cp=PR[o](Bp),cm=PR[o](Bm),ub=-B[0];
 const Bs=k===1?`B(${B[0]}; ${B[1]}; ?)`:`B(${B[0]}; ?; ${B[2]})`;
 return{title:`Обратная задача: найти B${so} по углу ${G}`,given:`A${s}B${s}, A${so} и угол ${G} = ${ang}°`,task:`B${so}`,axes:'x',pts:[P1(A),P2(A),ak,bk,B0,cp,cm,[ub,0]],
  base:g=>{g.link(P1(A),P2(A));g.inf([ub,0],[ub,1],{c:'aux',w:1,dash:2});g.line(ak,bk,{c:'c'+k,w:2.6});drawPts(g,[{p:ak,label:'A'+s,c:'c'+k,lp:lblDir(ak,bk)},{p:bk,label:'B'+s,c:'c'+k,lp:lblDir(bk,ak)},{p:ao,label:'A'+so,c:'c'+o,lp:[-24,-8]}]);},
  steps:[{s:'Тип задачи',t:`Дан угол ${G} к П${s}, и проекция A${s}B${s} известна <b>целиком</b>. Угол к той же плоскости, где проекция дана → <b>тип 1</b>: треугольник строим прямо на A${s}B${s}.`,why:`В треугольнике для ${G} катеты — A${s}B${s} и Δ${c}. Один катет и угол известны → треугольник однозначен, из него найдём Δ${c}.`},
  {s:`Угол при A${s}`,t:`При A${s} откладываем угол ${G} = ${ang}° от A${s}B${s}, из B${s} — перпендикуляр к A${s}B${s}. Пересечение — <b>B₀</b>.`,mem:'«Угол сидит у тени» — при проекции.',
   q:{q:'Где строим заданный угол?',opts:[{t:`при A${s}, между A${s}B${s} и будущей гипотенузой`,ok:true},{t:`при B${s}`,ok:false,why:'при B — прямой угол'},{t:`между A${s}B${s} и осью x`,ok:false}]},
   d:g=>{g.line(ak,B0,{c:'nv',w:2.8});g.rightAngle(bk,ak,B0);g.inf(bk,V.add(bk,n),{c:'aux',w:1,dash:1});g.arc(ak,bk,B0,30,{label:G});g.pt(B0,'B₀',{c:'nv',lp:lblDir(B0,bk)});}},
  {s:`Δ${c} = катет`,t:`Катет B${s}B₀ — это <b class="cdd">Δ${c}</b>. Его не считают — берут с чертежа циркулем.`,why:'Катет и прилежащий угол задают треугольник однозначно — второй катет получается построением.',d:g=>{g.line(bk,B0,{c:'dd',w:3.6});g.dim(bk,B0,'Δ'+c,{c:'dd',dx:12});}},
  {s:'Переносим Δ',t:k===1?`На П₂ от уровня A₂ откладываем Δz по линии связи B <b>вверх и вниз</b> → <b>B₂</b> и <b>B₂′</b>.`:`На П₁ от уровня A₁ откладываем Δy по линии связи B в обе стороны → <b>B₁</b> и <b>B₁′</b>.`,
   why:'Треугольник дал только <b>величину</b> Δ, но не знак: B может быть на Δ выше (ближе) A или на столько же ниже (дальше). Оба варианта дают тот же угол.',q:{q:'Сколько решений у задачи?',opts:[{t:'2',ok:true},{t:'1',ok:false},{t:'0',ok:false},{t:'бесконечно много',ok:false}]},
   d:g=>{g.link(ao,[ub,ao[1]],{c:'dd'});g.line([ub,ao[1]],cp,{c:'dd',w:3,op:.6});g.line([ub,ao[1]],cm,{c:'dd',w:3,op:.6});g.line(ao,cp,{c:'c'+o,w:2.6});g.line(ao,cm,{c:'c'+o,w:2,dash:1});g.pt(cp,'B'+so,{c:'c'+o,lp:[9,-9]});g.pt(cm,'B'+so+'′',{c:'c'+o,lp:[9,9]});}}],
  answer:`два решения: B${so} и B${so}′ — на Δ${c} выше и ниже уровня A${so}`};}};
WE.inv2={id:'inv2',topic:'tri',icon:'○',t:'Обратная · тип 2 (окружность)',make(){let A,B,be,Dx,Dy,R,Dz,imp=Math.random()<.25;
 for(let i=0;i<3000;i++){A=[rnd(10,50),rnd(8,45),rnd(15,45)];B=[rnd(8,52),rnd(8,48),0];Dx=Math.abs(A[0]-B[0]);Dy=Math.abs(A[1]-B[1]);if(Dx<10||Dy<8)continue;const bmax=deg(Math.atan2(Dy,Dx));
  if(imp){be=Math.round(bmax+rnd(7,14));if(be>78)continue;R=Dy/Math.tan(rad(be));Dz=NaN;break;}
  if(bmax<20)continue;be=rnd(12,Math.floor(bmax)-6);R=Dy/Math.tan(rad(be));Dz=Math.sqrt(R*R-Dx*Dx);if(Dz>=6&&Dz<=24&&A[2]-Dz>=4&&A[2]+Dz<=56)break;}
 const ub=-B[0],a1=P1(A),a2=P2(A),b1=[ub,-B[1]],F=lineFacts(A,[B[0],B[1],A[2]]),T0=[8,10],T1=[8+R,10],T2=[8+R,10+Dy];
 const circ=g=>{const N=90;let p=null;for(let i=0;i<=N;i++){const t=i/N*2*Math.PI,q=[a2[0]+R*Math.cos(t),a2[1]+R*Math.sin(t)];if(p)g.line(p,q,{c:'nv',w:1.4});p=q;}};

WE.comp={id:'comp',topic:'rel',icon:'',t:'Конкурирующие точки и видимость',make(){const pl=pick([1,2]);let A,B,C,D,ka,kb;

<script>

  text(p,t,cls="lbl",dx=6,dy=-6,anchor="start"){this.o.push(`<text x="${(p[0]+dx).toFixed(1)}" y="${(p[1]+dy).toFixed(1)}" class="${cls}" text-anchor="${anchor}">${t}</text>`);return this;},

/* ======== PRACTICE ENGINE ======== */
const P3=(x,f,h)=>({x,f,h});

const SEGC={s1:"pl",s2:"p2",aux:"au",res:"rs",lk:"lk",ext1:"pl ex",ext2:"p2 ex",exta:"au ex",extr:"rs ex",both:"bo",hl:"au thick",hlr:"rs thick",bad:"bd",gap:"bd gp",chk:"ck"};

const isDr=i=>i.k==="seg"||i.k==="pt"||i.k==="poly";
const visI=(i,step)=>i.s<=step&&(i.e===undefined||step<=i.e);
function renderTask(svg,D,step,o={}){
  const all=[];D.it.filter(isDr).forEach(i=>{if(i.k==="seg"){all.push(i.a,i.b);}else if(i.k==="pt")all.push(i.p);else all.push(...i.pts);});
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);const pad=34;

function lift(B,step,o={}){const M=mapOf(B),W=M.W,E=M.E,hk=o.hk||new Set();const it3=room(M.L,{p3:false});const add=(...a)=>it3.push(...a);const seen=new Set();
 const L=B.D.it.filter(it=>visI(it,step)).map(it=>({it,x:false}));if(o.extra)o.extra.it.forEach(it=>{if(!it.no3d)L.push({it,x:true});});

   else{let a=W({x:it.a[0],f:it.a[1],h:0}),b=W({x:it.b[0],f:it.b[1],h:0});[a,b]=clipZ(a,b,0,E[2]+4);pts=[[a[0],0,a[2]],[b[0],0,b[2]],[b[0],E[1]+4,b[2]],[a[0],E[1]+4,a[2]]];tr=[pts[0],pts[1]];}

 why:{
  h2:`<b>h₂ — горизонталь h, вид спереди.</b> Лежит ∥ краю листа, потому что все точки h на <b>одной высоте</b>. По этому горизонталь и узнают: спереди она всегда «лежит».`,
  h1:`<b>h₁ — та же горизонталь, вид сверху.</b> Здесь видно её направление «на карте». Это направление — ключ задачи: <b>все</b> горизонтали плоскости Σ идут так же.`,
  a2:`<b>a₂ — вторая прямая плоскости Σ, вид спереди.</b> Наклонная → у её точек разные высоты. Поэтому именно она «протыкает» горизонтальную плоскость Γ.`,
  a1:`<b>a₁ — прямая a, вид сверху.</b> На ней мы будем искать точку 1₁ (точка 1 лежит на a).`,
  lkO:`<b>Линия связи точки O = h ∩ a</b> (место, где прямые сходятся, — «излом»). Две проекции одной точки всегда на одной вертикали: «лево-право» (x) у точки одно. Проверка: если бы изломы спереди и сверху стояли на разных вертикалях — прямые бы <i>скрещивались</i>, и плоскости Σ не было бы.`,
  O2:`<b>O₂</b> — точка пересечения h и a, вид спереди. В тетради её обычно не подписывают — подписали тут, чтобы было видно, откуда пунктир.`,
  O1:`<b>O₁</b> — та же точка O сверху. Стоит на одной вертикали с O₂.`,
  G2:`<b>Γ₂ — плоскость Γ, вид спереди.</b> Γ горизонтальна, как поверхность воды или стол на уровне глаз: спереди видна <b>ребром</b>, одной линией. Сверху она заняла бы весь лист, поэтому Γ₁ не рисуют. Главное следствие: <b>всё, что лежит в Γ, спереди окажется на этой линии</b>.`,
  p12:`<b>1₂ = a₂ ∩ Γ₂.</b> Спереди видно, где прямая a «уходит под воду». Точка 1 лежит на a (значит, в Σ) и в Γ — она <b>общая</b>.`,
  lk1:`<b>Линия связи точки 1.</b> Из 1₂ идём строго вертикально вниз (x тот же) и останавливаемся на a₁ — ведь точка 1 лежит на a, значит и сверху она на a₁.`,
  p11:`<b>1₁</b> — точка 1 сверху: пересечение линии связи с a₁.`,
  l1:`<b>l₁ — ответ, вид сверху.</b> Через 1₁ параллельно h₁. Почему ∥? l — «линия воды» на наклонной доске Σ, т.е. тоже горизонталь Σ. А все горизонтали одной плоскости параллельны.`,
  l2:`<b>l₂ ≡ Γ₂ — ответ, вид спереди.</b> l лежит в Γ, а всё, что в Γ, спереди попадает на линию Γ₂. Рисовать отдельно не нужно — линии совпали (≡).`,
  bad:`<b>Неправильная l₁</b> — через 1₁, но не ∥ h₁. Её вторая точка лежит в Γ, но <b>не на Σ</b>: смотри зазор.`},
 build(G=100){const O=P3(300,60,250),He=P3(460,60,285),A=P3(215,170,310);const p1=atF(O,A,G),q2=atF(He,A,G);const D=new Draw();
  D.fill([O,He,Padd(O,He,A),A],"s1",0,"Σ");D.pl({t:"H",f:G,s:0,c:"s2",n:"Γ",id:"G"});
  D.seg(Fp(O),Fp(He),"s1",0,"h₂",{id:"h2"}).seg(Fp(O),Fp(A),"s1",0,"a₂",{id:"a2"}).seg(Hp(O),Hp(He),"s1",0,"h₁",{id:"h1"}).seg(Hp(O),Hp(A),"s1",0,"a₁",{id:"a1"}).lk(O,0,{id:"lkO"});
  D.pt(Fp(O),"s1",0,"O₂",{id:"O2",lc:"lbl s",pref:[-8,-8,"end"]}).pt(Hp(O),"s1",0,"O₁",{id:"O1",lc:"lbl s",pref:[-8,-8,"end"]});
  D.seg([480,G],[190,G],"s2",0,"Γ₂",{id:"G2",pl:"G"});
  D.seg([190,G],[480,G],"hl",1,null,{e:1,pl:"G"});
  D.lk(p1,2,{id:"lk1"}).pt(Fp(p1),"aux",2,"1₂",{id:"p12"}).pt(Hp(p1),"aux",2,"1₁",{id:"p11"});
  const dx=He.x-O.x,dh=He.h-O.h;const E1=P3(p1.x-dx*.5,G,p1.h-dh*.5),E2=P3(p1.x+dx*1.1,G,p1.h+dh*1.1);
  D.seg(Hp(E1),Hp(E2),"res",3,"l₁",{id:"l1"});D.seg([190,G],[480,G],"res",3,"l₂ ≡ Γ₂",{id:"l2",s3:[E1,E2]});
  return{D,P:{O,He,A,p1,q2,G},check:{a:[O,He,A],b:[P3(0,G,0),P3(100,G,0),P3(0,G,100)],r:[p1,q2]}};},
 steps:[
  {t:"Условие",d:"<p>Плоскость Σ задана пересекающимися прямыми h и a, плоскость Γ — фронтальным следом Γ₂. Найти линию пересечения l.</p>",
   why:`Каждый объект нарисован <b>дважды</b>: сверху листа — вид спереди (индекс ₂), снизу — вид сверху (индекс ₁). [[h2,h1|h₂ и h₁]] — одна прямая h, [[a2,a1|a₂ и a₁]] — прямая a. Они пересекаются в точке [[lkO,O2,O1|O]] — поэтому «излом» на обоих видах стоит на одной вертикали (пунктир). В 3D: контрастный лист Σ натянут на h и a, бледная горизонтальная «вода» — Γ. [[@iso|Покрути 3D]].`,
   mem:`<b>₁ — пол</b> (смотрим сверху), <b>₂ — стена</b> (смотрим спереди). Пунктир по вертикали — «нитка», на которую нанизаны две проекции одной точки.`,
   ask:{q:"Как по виду спереди понять, что Γ горизонтальна?",a:"Её след [[G2|Γ₂]] ∥ краю листа (оси x): все точки Γ на одной высоте."}},
  {t:"1. Определяем положение плоскостей",d:"<p>Σ(h ∩ a) — общего положения. Γ₂ горизонтален (∥ оси x) ⇒ Γ ∥ П₁ — <b>горизонтальная плоскость уровня</b> (ГПУ). Всё, что лежит в Γ, проецируется на П₂ в Γ₂.</p>",al:[0],
   why:`[[G2|Γ₂]] — одна прямая ∥ x: спереди плоскость сплющилась в линию, видна <b>ребром</b>. Значит, Γ ∥ полу. У Σ ни одна проекция не сплющилась — она видна «лицом» и спереди, и сверху: <b>общее положение</b>. [[@front|Посмотри в 3D спереди]] — бледная плоскость Γ станет линией, а лист Σ — нет.`,
   alt:{q:"А почему не рисуют Γ₁ — вид Γ сверху?",cam:"top",a:"Сверху горизонтальная плоскость — это весь лист: линии, по которой можно что-то найти, она не даёт. Поэтому ГПУ задают одним следом Γ₂. В 3D сейчас вид сверху — Γ закрыла всё."},
   mem:`<b>Стол на уровне глаз</b>: всё, что лежит на столе, видно на линии его края. Видна ребром → всё, что в плоскости, лежит на этой линии.`,
   ask:{q:"Где спереди окажется искомая линия l = Σ ∩ Γ?",a:"На [[G2|Γ₂]]: l ⊂ Γ, а всё в Γ спереди лежит на Γ₂. Значит, l₂ ≡ Γ₂ уже известна — осталось найти l₁."}},
  {t:"2. Первая общая точка: 1 = a ∩ Γ",d:"<div class='formula'>1₂ = a₂ ∩ Γ₂ → линия связи → 1₁ ∈ a₁</div><p>Точка 1 лежит на a (значит, в Σ) и в Γ — она общая.</p>",al:[1],
   why:`Нужна точка, которая лежит и в Σ, и в Γ. Берём прямую [[a2,a1|a]] из Σ и ищем, где она пересекает Γ. Спереди Γ — линия, поэтому пересечение видно сразу: [[p12|1₂]]. Затем строго вниз по [[lk1|линии связи]] до [[a1|a₁]] — получаем [[p11|1₁]]. Почему на a₁, а не где-то на вертикали? Линия связи даёт только x, а глубину даёт прямая, на которой лежит точка.`,
   alt:{q:"А почему не взять пересечение h₂ и Γ₂?",cam:"front",a:"[[h2,G2|h₂ ∥ Γ₂]] — они не пересекаются. h лежит на своей высоте, Γ — на своей: горизонталь параллельна горизонтальной плоскости и «под воду» не уходит. Протыкает Γ только наклонная прямая — [[a2|a]]."},
   mem:`Алгоритм <b>«Ч-В-Н»</b>: <b>Ч</b>итаем пересечение там, где плоскость видна линией (спереди) → <b>В</b>низ по вертикали → <b>Н</b>а свою прямую (a₁).`,
   ask:{q:"Одной точки мало, чтобы провести прямую. Чего ещё не хватает?",a:"Второй точки <b>или направления</b>. Направление подскажут горизонтали — см. следующий шаг."}},
  {t:"3. Направление: l ∥ h",d:"<p>ГПУ пересекает любую плоскость по её <b>горизонтали</b>, а все горизонтали плоскости параллельны. Поэтому l ∥ h.</p><div class='formula'>l₂ ≡ Γ₂;  l₁ ∥ h₁, 1₁ ∈ l₁</div>",al:[1],
   why:`Представь: Σ — наклонная доска, Γ — поверхность воды. Линия, где вода касается доски, — это [[l1,l2|l]]. Все её точки на высоте воды → l — <b>горизонталь</b> доски. На доске уже есть горизонталь [[h1,h2|h]] — тоже «линия воды», только при другом уровне. Береговые линии при разных уровнях параллельны → [[l1,h1|l₁ ∥ h₁]]. Спереди строить нечего: [[l2,G2|l₂ ≡ Γ₂]]. <b>Подвигай ползунок уровня воды</b> под 3D — l₁ сдвигается, но не поворачивается.`,
   alt:{q:"А если провести l₁ через 1₁ под другим углом?",a:"Тогда вторая точка такой прямой лежит в Γ (спереди — на Γ₂), но <b>не на доске Σ</b>: настоящая точка Σ с тем же положением на карте выше или ниже — [[gap,bad2,okS|зазор]] виден и на эпюре, и в 3D. У такой прямой с Σ только одна общая точка — это не линия пересечения, а прямая, протыкающая Σ."},
   mem:`<b>Береговая линия</b>: вода всегда горизонтальна, поэтому линия воды на любом склоне — горизонталь. Подняли воду — линия сдвинулась параллельно. Правило: <b>ГПУ ∩ Σ = горизонталь Σ</b> ⇒ l₂ ≡ Γ₂, l₁ ∥ h₁.`,
   ask:{q:"Нужна ли вторая точка?",a:"Нет: прямую задают <b>точка + направление</b>. Точка [[p11|1₁]] есть, направление ∥ [[h1|h₁]] есть."}},
  {t:"4. Ответ",d:"<p>Вторая точка не понадобилась: хватило одной точки и известного направления.</p><div class='formula'>l = Σ ∩ Γ</div>",al:[2],
   why:`Проверь по картинке: [[l2,G2|l₂ лежит на Γ₂]], [[l1,h1|l₁ ∥ h₁]], [[l1,p11|l₁ проходит через 1₁]]. В 3D нажми [[@unfold|разложить в эпюр]] — пространственная картинка сложится ровно в чертёж слева.`,
   alt:{q:"Проверить второй точкой?",ok:true,a:"Возьмём ещё одну прямую Σ — через концы h и a. Спереди она пересекает Γ₂ в [[c22|2₂]], по линии связи — [[c21|2₁]]. И 2₁ попадает точно на [[l1|l₁]] ✓ — значит, направление «∥ h₁» сработало."},
   mem:`Формула задачи в 4 словах: <b>«ГПУ режет по горизонтали»</b>. Одна точка (a ∩ Γ) + направление (∥ h) = ответ.`}]});
