 answer:"l(l₁, l₂) = MN.",
 checks:["n₁ ∥ n′₁ — горизонтали плоскости Θ параллельны","h′₁ ∥ h₁ — горизонтали Ω параллельны","M₂ ∈ Γ₂, N₂ ∈ h₂, линии связи вертикальны"],
 why:{
  a2:`<b>a₂</b> — прямая a плоскости Θ спереди. a₂ ∥ b₂ и a₁ ∥ b₁ — так на чертеже выглядят <b>параллельные</b> прямые.`,b2:`<b>b₂</b> — вторая параллельная прямая плоскости Θ, спереди.`,
  h2:`<b>h₂ ∥ x</b> → h — горизонталь плоскости Ω (все точки на одной высоте). Сверху [[h1|h₁]] показывает направление всех горизонталей Ω.`,
  h1:`<b>h₁</b> — горизонталь Ω сверху. Её направление повторят все горизонтали Ω, в том числе h′.`,
  G:`<b>Γ₂ ≡ n₂ ≡ h′₂</b> — первый «этаж» Γ. Спереди он виден ребром, поэтому на этой линии лежат и n₂ (сечение Θ), и h′₂ (сечение Ω) — три имени у одной линии.`,
  n1:`<b>n₁ = (1₁2₁)</b> — по этой прямой этаж Γ режет Θ. Это горизонталь Θ.`,
  hp1:`<b>h′₁ ∥ h₁ через 3₁</b> — по этой прямой этаж Γ режет Ω. Это горизонталь Ω, поэтому ∥ h₁, хватило одной точки 3.`,
  M1:`<b>M₁ = n₁ ∩ h′₁</b> — перекрёсток двух следов на одном этаже. Точка M лежит и в Θ (на n), и в Ω (на h′) — общая.`,M2:`<b>M₂</b> — поднялись из M₁ по линии связи до Γ₂ (M на этаже Γ).`,
  n2:`<b>n′₁ = (4₁5₁)</b> — сечение Θ вторым этажом Γ′. Контроль: n′₁ ∥ n₁.`,
  N1:`<b>N₁ = n′₁ ∩ h₁</b> — второй этаж проведён через саму h, поэтому сечение Ω — это h. Общая точка №2.`,N2:`<b>N₂</b> — по линии связи на h₂ (≡ Γ′₂).`,
  l1:`<b>l₁ = M₁N₁</b> — ответ сверху.`,l2:`<b>l₂ = M₂N₂</b> — ответ спереди.`},
 build(){const A1=P3(120,40,230),A2=P3(200,200,360),B1=P3(60,60,270),B2=P3(140,220,400);
  const S0=P3(260,150,300),He=P3(460,150,360),Ke=P3(460,40,230);const Hs=atX(S0,He,215);
  const G=100,G2=150;const D=new Draw();
  D.fill([A1,A2,B2,B1],"s1",0,"Θ").fill([S0,He,Ke],"s2",0,"Ω",{li:1});D.pl({t:"H",f:G,s:1,c:"aux",n:"Γ",id:"G"}).pl({t:"H",f:G2,s:5,c:"aux",n:"Γ′",id:"Gp"});
  D.seg(Fp(A1),Fp(A2),"s1",0,"a₂",{labAt:"a",id:"a2"}).seg(Fp(B1),Fp(B2),"s1",0,"b₂",{labAt:"a",id:"b2"}).seg(Hp(A1),Hp(A2),"s1",0,"a₁",{id:"a1"}).seg(Hp(B1),Hp(B2),"s1",0,"b₁",{id:"b1"});
  D.seg(Fp(Hs),Fp(He),"s2",0,"h₂",{id:"h2"}).seg(Fp(S0),Fp(Ke),"s2",0,"k₂",{id:"k2"}).seg(Hp(Hs),Hp(He),"s2",0,"h₁",{id:"h1"}).seg(Hp(S0),Hp(Ke),"s2",0,"k₁",{id:"k1"}).lk(S0,0,{id:"lkS"});
  D.pt(Fp(S0),"s2",0,"O₂",{id:"lkS",lc:"lbl s",pref:[-8,18,"end"]}).pt(Hp(S0),"s2",0,"O₁",{id:"lkS",lc:"lbl s",pref:[-8,-8,"end"]});
  D.seg([40,G],[480,G],"aux",1,"Γ₂ ≡ n₂ ≡ h′₂",{labAt:"b",id:"G",pl:"G"});
  const p1=atF(A1,A2,G),p2=atF(B1,B2,G),p3=atF(S0,Ke,G);
  D.pt(Fp(p1),"aux",2,"1₂",{id:"p12"}).pt(Fp(p2),"aux",2,"2₂",{id:"p22"}).lk(p1,2,{id:"p12"}).lk(p2,2,{id:"p22"}).pt(Hp(p1),"aux",2,"1₁",{id:"p11"}).pt(Hp(p2),"aux",2,"2₁",{id:"p21"});
  const hd=[He.x-S0.x,He.h-S0.h];
  const M=cutH(p1,p2,Hp(p3),[p3.x+hd[0],p3.h+hd[1]]);
  const n=seg2(Hp(p2),Hp(p1),-.25,tX(p2,p1,M.x)+.35);D.seg(n[0],n[1],"aux",2,"n₁",{id:"n1"});
  D.pt(Fp(p3),"aux",3,"3₂",{id:"p32"}).lk(p3,3,{id:"p32"}).pt(Hp(p3),"aux",3,"3₁",{id:"p31"});
  const r=hd[1]/hd[0];D.seg(Hp(P3(M.x-50,G,M.h-50*r)),Hp(P3(p3.x+60,G,p3.h+60*r)),"aux",3,"h′₁",{id:"hp1"});
  D.lk(M,4,{id:"M1"}).pt(Hp(M),"res",4,"M₁",{id:"M1"}).pt(Fp(M),"res",4,"M₂",{id:"M2"});
  D.seg(Fp(Hs),Fp(He),"hl",5,null,{e:5,pl:"Gp"});
  const p4=atF(A1,A2,G2),p5=atF(B1,B2,G2);
  D.pt(Fp(p4),"aux",5,"4₂",{id:"p42"}).pt(Fp(p5),"aux",5,"5₂",{id:"p52"}).lk(p4,5,{id:"p42"}).lk(p5,5,{id:"p52"}).pt(Hp(p4),"aux",5,"4₁",{id:"p41"}).pt(Hp(p5),"aux",5,"5₁",{id:"p51"});
  const N=cutH(p4,p5,Hp(S0),Hp(He));
  const n2=seg2(Hp(p5),Hp(p4),-.25,tX(p5,p4,N.x)+.35);D.seg(n2[0],n2[1],"aux",5,"n′₁",{id:"n2"});
  D.lk(N,6,{id:"N1"}).pt(Hp(N),"res",6,"N₁",{id:"N1"}).pt(Fp(N),"res",6,"N₂",{id:"N2"});
  const r2=seg2(Fp(M),Fp(N),-.9,1.9),r1=seg2(Hp(M),Hp(N),-.9,1.9);D.seg(r2[0],r2[1],"res",7,"l₂",{id:"l2"}).seg(r1[0],r1[1],"res",7,"l₁",{id:"l1"});
  return{D,P:{M,N,p1,p2,p3},check:{a:[A1,A2,B1],b:[S0,He,Ke],r:[M,N]}};},
 steps:[
  {t:"Условие",d:"<p>Θ задана параллельными прямыми a и b, Ω — пересекающимися h и k (h — горизонталь, h₂ ∥ x). Найти l = Θ ∩ Ω.</p>",
   why:`Θ — «лист», натянутый на две параллельные прямые [[a2,a1|a]] и [[b2,b1|b]]: у параллельных прямых параллельны и проекции. Ω натянута на горизонталь [[h2,h1|h]] (спереди лежит ∥ x) и прямую [[k2,k1|k]]; они сходятся в точке [[lkS|O]]. В 3D видно, что два листа где-то пересекаются — это l.`,
   mem:`Параллельные прямые → <b>параллельны обе пары проекций</b>: a₂ ∥ b₂ и a₁ ∥ b₁.`,
   ask:{q:"Видна ли здесь хоть одна плоскость ребром (линией)?",a:"Нет — обе общего положения. Значит, линию пересечения «прочитать» нельзя, нужен помощник-посредник."}},
  {t:"1. Анализ и первый посредник Γ",d:"<p>Обе плоскости общего положения — линию сразу не видно. Нужны <b>две общие точки</b>. Проводим горизонтальную плоскость уровня Γ: её след Γ₂ ∥ x.</p>",al:[0,1],
   why:`Хитрость: вводим третью плоскость, которая видна ребром, — горизонтальный «этаж» [[G|Γ]]. Этаж разрежет каждую плоскость по прямой, и там, где две прямые встретятся, будет общая точка. Почему этаж горизонтальный? Тогда спереди он — линия, и все пересечения с ним читаются сразу.`,
   alt:{q:"А можно провести Γ на любой высоте?",cam:"front",a:"Да — на любой, где Γ₂ пересекает прямые обеих плоскостей. Удобно, чтобы точки не уходили за край листа. Линия l от выбора этажа не зависит: каждый этаж просто даёт другую её точку."},
   mem:`<b>Метод этажей</b>: этаж режет каждую плоскость по «следу на полу» — горизонтали. Два следа на одном полу встретились → общая точка. <b>Два этажа → две точки → линия.</b>`,
   ask:{q:"Сколько этажей понадобится?",a:"Два: каждый даёт одну точку, а прямую задают две."}},
  {t:"2. Γ ∩ Θ = n",d:"<div class='formula'>1₂ = a₂ ∩ Γ₂,  2₂ = b₂ ∩ Γ₂  →  1₁ ∈ a₁,  2₁ ∈ b₁<br>n₁ = (1₁2₁)</div><p>n — горизонталь плоскости Θ.</p>",al:[1],
   why:`Спереди этаж [[G|Γ₂]] пересекает [[a2|a₂]] в [[p12|1₂]] и [[b2|b₂]] в [[p22|2₂]]. Вниз по линиям связи — на <b>свои</b> прямые [[a1|a₁]] и [[b1|b₁]]: [[p11|1₁]], [[p21|2₁]]. Через них — [[n1|n₁]]. Спереди n не рисуем: она лежит на этаже, а этаж спереди — линия Γ₂.`,
   alt:{q:"Почему 1₁ ищем именно на a₁?",a:"Линия связи даёт только «лево-право». Где точка по глубине, говорит прямая, на которой она лежит: 1 ∈ a ⇒ 1₁ = линия связи ∩ [[a1|a₁]]. Опустишь на b₁ — получишь чужую точку."},
   mem:`Точку переносим всегда на <b>ту же</b> прямую, где её нашли: 1 ∈ a ⇒ 1₁ ∈ a₁.`},
  {t:"3. Γ ∩ Ω = h′",d:"<div class='formula'>3₂ = k₂ ∩ Γ₂ → 3₁ ∈ k₁;  h′₁ ∥ h₁, 3₁ ∈ h′₁</div><p>Горизонтали одной плоскости параллельны — поэтому хватает одной точки 3.</p>",al:[1],
   why:`На этом этаже Ω оставляет свою горизонталь h′. Одна её точка — [[p32,p31|3]] = k ∩ Γ. Вторую искать не надо: все горизонтали Ω параллельны [[h1|h₁]] (вспомни «береговые линии» из задачи 1) → [[hp1,h1|h′₁ ∥ h₁]].`,
   ask:{q:"Почему для n понадобились две точки, а для h′ — одна?",a:"В Θ нет готовой горизонтали — направление n неизвестно. В Ω горизонталь [[h1|h]] дана → направление есть, достаточно одной точки."}},
  {t:"4. Первая общая точка M",d:"<p>n и h′ лежат в одной плоскости Γ ⇒ пересекаются.</p><div class='formula'>M₁ = n₁ ∩ h′₁  →  M₂ ∈ Γ₂</div>",al:[1],
   why:`[[n1|n]] и [[hp1|h′]] лежат на одном этаже → пересекаются. Точка [[M1|M]] — на n (значит, в Θ) и на h′ (значит, в Ω): общая. Вверх по линии связи до Γ₂ → [[M2|M₂]].`,
   mem:`Общая точка = <b>перекрёсток</b> двух следов на одном этаже.`},
  {t:"5. Второй посредник Γ′ ≡ h₂",d:"<p>Выгодно провести Γ′ <b>через саму горизонталь h</b>: тогда Γ′ ∩ Ω = h уже готова.</p><div class='formula'>4₂ = a₂ ∩ Γ′₂,  5₂ = b₂ ∩ Γ′₂ → 4₁, 5₁;  n′₁ = (4₁5₁)</div>",al:[2],
   why:`Второй этаж — <b>на высоте h</b>: Γ′₂ ≡ [[h2|h₂]]. Тогда сечение Ω — сама h, строить не надо. Остаётся Θ: [[p42,p41|4]] на a и [[p52,p51|5]] на b → [[n2|n′₁]].`,
   alt:{q:"Можно взять второй этаж где угодно?",a:"Можно, но тогда придётся строить ещё и горизонталь Ω на этом этаже (точка k ∩ Γ′ и прямая ∥ h₁). Через h — на два действия меньше."},
   mem:`Лень — двигатель НГ: проводи посредник <b>через то, что уже нарисовано</b>.`},
  {t:"6. Вторая общая точка N",d:"<div class='formula'>N₁ = n′₁ ∩ h₁  →  N₂ ∈ h₂</div><p>Контроль: n′₁ ∥ n₁.</p>",al:[2],
   why:`[[N1|N₁]] = [[n2|n′₁]] ∩ [[h1|h₁]] → по линии связи [[N2|N₂]] на h₂. Контроль: [[n2,n1|n′₁ ∥ n₁]] — горизонтали одной плоскости Θ. Не параллельны → ошибка в переносе точек.`},
  {t:"7. Ответ: l = MN",d:"<p>Соединяем одноимённые проекции точек M и N.</p><div class='formula'>l₂ = M₂N₂,  l₁ = M₁N₁;  l = Θ ∩ Ω</div>",al:[3],
   why:`Соединяем [[M1,N1,l1|M₁N₁]] и [[M2,N2,l2|M₂N₂]]. В 3D видно: выделенная прямая — ровно то место, где два листа проходят друг сквозь друга. [[@unfold|Разложи в эпюр]] — получишь чертёж слева.`,
   mem:`<b>Два этажа → две точки → линия.</b>`}]});

PR.push({id:"p3",num:"3",tab:"Задача 3",title:"Σ(△ABC) и Ψ(EF ∩ P)",sub:"Обе плоскости профильно-проецирующие (⊥ П₃)",
 given:["Σ(△ABC), A₁ ≡ A₂, C₁ ≡ C₂","Ψ(EF ∩ P)","l = Σ ∩ Ψ — ?"],
 algo:[["Σ(△ABC) → ЧП ⊥ П₃ (AC ∥ x)","Ψ(EF ∩ P) → ЧП ⊥ П₃ (P ∥ x)","⇒ l ⊥ П₃"],["AC ∥ P ⇒ l ∥ AC ∥ P"],["Δ(Δ₂) ⊥ П₂, F ∈ Δ"],["Δ ∩ Σ = (1-2)","Δ ∩ Ψ = (F-3)"],["(1-2) ∩ (F-3) = N"],["l ∋ N, l ∥ AC ⇒ l = Σ ∩ Ψ"]],
 legend:LEG2("Σ(△ABC)","Ψ(EF∩P)"),
 answer:"l(l₁, l₂): l₂ ∥ x через N₂, l₁ ∥ x через N₁ (l ⊥ П₃).",
 checks:["N₂ лежит на Δ₂","l₁ и l₂ параллельны A₁C₁ и P₁ / A₂C₂ и P₂"],
 why:{
  AC:`<b>A₂C₂ и A₁C₁ — одна горизонтальная линия.</b> Обе проекции AC ∥ x ⇒ у A и C одинаковы и высота, и глубина ⇒ AC ∥ оси x.`,
  A:`<b>A₁ ≡ A₂</b> — проекции точки A совпали на листе. Это не ошибка: ось x не нарисована, и виды спереди и сверху тут просто наложились. В 3D A — обычная точка.`,
  C:`<b>C₁ ≡ C₂</b> — то же, что с A: проекции наложились на безосном чертеже.`,
  P2:`<b>P₂ ∥ x</b> и [[P1|P₁ ∥ x]] ⇒ прямая P ∥ оси x. Плоскость с такой прямой ⊥ П₃.`,P1:`<b>P₁ ∥ x</b> — прямая P сверху. Вместе с P₂ ∥ x: P ∥ x.`,
  D2:`<b>Δ₂ — посредник Δ, вид спереди.</b> Δ ⊥ П₂ (фронтально-проецирующая): спереди видна ребром, поэтому все её пересечения читаются на этой линии. Проведена через F₂ — экономия: F сразу общая.`,
  a12:`<b>(1₁2₁) = Δ ∩ Σ</b>, вид сверху.`,f3:`<b>(F₁3₁) = Δ ∩ Ψ</b>, вид сверху.`,
  N1:`<b>N₁</b> — пересечение (1₁2₁) и (F₁3₁): обе прямые лежат в Δ, точка N — в Σ и в Ψ.`,N2:`<b>N₂</b> — по линии связи на Δ₂.`,
  l1:`<b>l₁ ∥ x через N₁</b>.`,l2:`<b>l₂ ∥ x через N₂</b>.`,badS:`Сечение Σ «этажом» — прямая ∥ x.`,badP:`Сечение Ψ «этажом» — тоже прямая ∥ x. Две параллельные — не пересекутся.`},
 build(){const A=P3(60,200,200),C=P3(260,200,200),B=P3(110,120,290),E=P3(330,70,240),F=P3(330,110,330),Pe=P3(460,70,240);
  const D=new Draw();D.fill([E,F,Padd(E,F,Pe),Pe],"s2",0,"Ψ");
  D.poly([Fp(A),Fp(B),Fp(C)],"s1",0).poly([Hp(A),Hp(B),Hp(C)],"s1",0);
  D.seg(Fp(A),Fp(B),"s1",0).seg(Fp(B),Fp(C),"s1",0,null,{id:"BC"}).seg(Fp(A),Fp(C),"s1",0,null,{id:"AC"}).seg(Hp(A),Hp(B),"s1",0).seg(Hp(B),Hp(C),"s1",0,null,{id:"BC"});
  D.pt(Fp(A),"s1",0,"A₁ ≡ A₂",{pref:[-8,5,"end"],id:"A"}).pt(Fp(C),"s1",0,"C₁ ≡ C₂",{id:"C"}).pt(Fp(B),"s1",0,"B₂").pt(Hp(B),"s1",0,"B₁").lk(B,0);
  D.lk(E,0).seg(Fp(E),Fp(F),"s2",0).seg(Hp(E),Hp(F),"s2",0).seg(Fp(E),Fp(Pe),"s2",0,"P₂",{id:"P2"}).seg(Hp(E),Hp(Pe),"s2",0,"P₁",{id:"P1"});
  D.pt(Fp(E),"s2",0,"E₂").pt(Fp(F),"s2",0,"F₂",{id:"F2"}).pt(Hp(E),"s2",0,"E₁").pt(Hp(F),"s2",0,"F₁");
  D.seg(Fp(A),Fp(C),"hl",1,null,{e:2}).seg(Fp(E),Fp(Pe),"hl",1,null,{e:2}).seg(Hp(E),Hp(Pe),"hl",1,null,{e:2});
  const q1=[180,200],q2=[F.x,F.f];const dl=seg2(q1,q2,-.45,1.75);D.seg(dl[0],dl[1],"aux",3,"Δ₂",{id:"D2",pl:"D"});D.pl({t:"D",a:dl[0],b:dl[1],s:3,c:"aux",n:"Δ",id:"D"});
  const p1=cutF(B,C,q1,q2),p2=cutF(A,C,q1,q2),p3=cutF(E,Pe,q1,q2);
  D.pt(Fp(p1),"aux",4,"1₂",{id:"p1"}).lk(p1,4,{id:"p1"}).pt(Hp(p1),"aux",4,"1₁",{id:"p1"}).pt(Fp(p2),"aux",4,"2₁ ≡ 2₂",{pref:[-6,20,"end"],id:"p2"}).pt(Fp(p3),"aux",4,"3₂",{id:"p3"}).lk(p3,4,{id:"p3"}).pt(Hp(p3),"aux",4,"3₁",{id:"p3"});
  const N=cutH(p2,p1,Hp(F),Hp(p3));
  const a12=seg2(Hp(p2),Hp(p1),-.15,tX(p2,p1,N.x)+.25);D.seg(a12[0],a12[1],"aux",4,null,{id:"a12"});
  const f3=seg2(Hp(F),Hp(p3),-.25,1.25);D.seg(f3[0],f3[1],"aux",4,null,{id:"f3"});
  D.lk(N,5,{id:"N1"}).pt(Hp(N),"res",5,"N₁",{id:"N1"}).pt(Fp(N),"res",5,"N₂",{id:"N2"});
  const L1=P3(45,N.f,N.h),L2=P3(480,N.f,N.h);D.seg(Fp(L1),Fp(L2),"res",6,"l₂",{id:"l2"}).seg(Hp(L1),Hp(L2),"res",6,"l₁",{id:"l1"});
  return{D,P:{A,B,C,E,F,Pe,N},check:{a:[A,B,C],b:[E,F,Pe],r:[N,P3(N.x+100,N.f,N.h)]}};},
 steps:[
  {t:"Условие",d:"<p>У точек A и C проекции совпадают: A₁ ≡ A₂, C₁ ≡ C₂. Ψ задана профильной прямой EF и прямой P, проходящей через E.</p>",
   why:`Странность чертежа: [[A|A₁ ≡ A₂]] и [[C|C₁ ≡ C₂]] — проекции совпали. Ось x не нарисована, поэтому виды спереди и сверху могут наложиться. В 3D это обычные точки. Важно другое: [[AC|A₁C₁ и A₂C₂]] — одна горизонтальная линия. EF — <b>профильная</b> прямая: E₁F₁ и E₂F₂ на одной вертикали.`,
   ask:{q:"Если у отрезка обе проекции ∥ x — как он лежит в пространстве?",a:"Параллельно оси x: и высота, и глубина у концов одинаковые."}},
  {t:"1. Анализ: обе плоскости ⊥ П₃",d:"<p>A₂C₂ и A₁C₁ — одна горизонтальная прямая ⇒ <b>AC ∥ x</b>. P₂ и P₁ тоже ∥ x ⇒ <b>P ∥ x</b>. Плоскость, содержащая прямую ∥ x, — профильно-проецирующая.</p><div class='formula'>Σ ⊥ П₃,  Ψ ⊥ П₃  ⇒  l ⊥ П₃</div>",al:[0],
   why:`[[AC|AC]] ∥ x и [[P2,P1|P]] ∥ x. Плоскость, в которой есть прямая ∥ x, «нанизана» на эту прямую, как на шампур, и на боковую стену П₃ смотрит ребром. Обе плоскости такие ⇒ их линия пересечения тоже ∥ x.`,
   mem:`<b>Шампур</b>: прямая ∥ x протыкает боковую стену П₃. Плоскость на таком шампуре ⊥ П₃.`},
  {t:"2. Направление l известно",d:"<p>В обеих плоскостях есть параллельные прямые AC и P. Значит, линия пересечения им параллельна. Осталось найти <b>одну</b> точку.</p><div class='formula'>AC ∥ P ⇒ l ∥ AC ∥ P</div>",al:[1],
   why:`Две плоскости, «нанизанные» на параллельные шампуры [[AC|AC]] и [[P2,P1|P]], пересекаются по прямой, параллельной этим шампурам. Значит, l на обоих видах — горизонтальная линия. Нужна одна точка.`,
   alt:{q:"А почему не взять «этаж» (ГПУ), как в задачах 1–2?",a:"Этаж режет каждую из этих плоскостей по горизонтали, а горизонтали обеих плоскостей ∥ x. Получаются [[badS,badP|две параллельные прямые]] — они не пересекаются, общей точки нет. Поэтому нужен посредник «поперёк» — фронтально-проецирующий Δ."},
   mem:`<b>Книга</b>: строчки на обеих страницах ∥ корешку → и сам корешок (линия пересечения страниц) ∥ строчкам.`},
  {t:"3. Посредник Δ ⊥ П₂",d:"<p>Проводим фронтально-проецирующую плоскость Δ через точку F (её след — прямая Δ₂). Так одна точка линии (F-3) уже есть.</p>",al:[2],
   why:`[[D2|Δ]] спереди видна ребром — все её пересечения читаются на линии Δ₂. Наклон Δ₂ любой, лишь бы не горизонтальный (иначе — тупик из прошлого шага). Через [[F2|F₂]] — чтобы F сразу была общей точкой Δ и Ψ.`,
   mem:`Посредник выбирают так, чтобы он был <b>виден линией</b> и <b>проходил через готовое</b>.`},
  {t:"4. Линии пересечения с Δ",d:"<div class='formula'>Δ ∩ Σ: 1₂ = Δ₂ ∩ B₂C₂ → 1₁;  2₂ = Δ₂ ∩ A₂C₂ = 2₁<br>Δ ∩ Ψ: F и 3₂ = Δ₂ ∩ P₂ → 3₁</div>",al:[3],
   why:`Спереди Δ₂ пересекает [[BC|B₂C₂]] в [[p1|1₂]], [[AC|A₂C₂]] в [[p2|2₂]] (на AC проекции совпали → 2₁ ≡ 2₂), [[P2|P₂]] в [[p3|3₂]]. Вниз по линиям связи → 1₁, 3₁. Сверху получаем [[a12|(1₁2₁) = Δ ∩ Σ]] и [[f3|(F₁3₁) = Δ ∩ Ψ]].`},
  {t:"5. Общая точка N",d:"<div class='formula'>N₁ = (1₁2₁) ∩ (F₁3₁)  →  N₂ ∈ Δ₂</div>",al:[4],
   why:`Обе прямые лежат в Δ → пересекаются: [[N1|N₁]]. Вверх по линии связи — [[N2|N₂]] на Δ₂.`},
  {t:"6. Ответ",d:"<p>Через N проводим прямую, параллельную AC (∥ x), в обеих проекциях.</p><div class='formula'>l₂ ∥ x, N₂ ∈ l₂;  l₁ ∥ x, N₁ ∈ l₁</div>",al:[5],
   why:`[[l2,l1|l]] — точка N + направление ∥ x. В 3D видно, как выделенная прямая идёт вдоль «шампуров» AC и P.`}]});
PR[2].steps[2].alt.build=B=>{const{A,B:Bv,C,E,F}=B.P;const g=112,D=new Draw();const s1=atF(A,Bv,g),s2=atF(C,Bv,g),e1=atF(E,F,g);
 D.seg([45,g],[480,g],"bad",0,"Γ₂ ?",{id:"badG",no3d:1});D.pl({t:"H",f:g,c:"bad",n:"Γ?",id:"badG"});
 D.seg(Hp(P3(55,g,s1.h)),Hp(P3(300,g,s1.h)),"bad",0,"Γ ∩ Σ",{id:"badS",labAt:"a"});D.seg(Hp(P3(e1.x-150,g,e1.h)),Hp(P3(e1.x+130,g,e1.h)),"bad",0,"Γ ∩ Ψ — ∥, не пересекутся",{id:"badP"});return D;};

PR.push({id:"p4",num:"4",tab:"Задача 4",title:"Σ(h ∩ f) и Ω(h′ ∩ f′)",sub:"Особый случай: h₂ ≡ f₁ ≡ h′₂ ≡ f′₁",
 given:["Σ(h ∩ f)","Ω(h′ ∩ f′)","l = Σ ∩ Ω — ?"],
 algo:[["Σ(h ∩ f) → ОП","Ω(h′ ∩ f′) → ОП"],["h₂ ≡ h′₂ ⇒ h ∩ h′ = N"],["f ∥ f′ ⇒ l ∥ f ∥ f′"],["l = Σ ∩ Ω"]],
 legend:LEG2("Σ(h∩f)","Ω(h′∩f′)"),
 answer:"l(l₁, l₂): l₂ ∥ f₂ через N₂, l₁ ∥ f₁ (∥ x) через N₁.",
 checks:["N₂ лежит на общей прямой h₂ ≡ h′₂","l₂ ∥ f₂ ∥ f′₂"],
 why:{
  both:`<b>Одна линия — четыре проекции.</b> Спереди это h₂ и h′₂ (горизонтали лежат), сверху — f₁ и f′₁ (фронтали лежат). Читай её четыре раза — для каждого имени.`,
  f2:`<b>f₂</b> — фронталь f спереди: тут видна её настоящая длина и наклон. Сверху f₁ ∥ x.`,fp2:`<b>f′₂</b> — фронталь второй плоскости. f₂ ∥ f′₂ ⇒ f ∥ f′.`,
  h1:`<b>h₁</b> — горизонталь Σ сверху.`,hp1:`<b>h′₁</b> — горизонталь Ω сверху. Не ∥ h₁ → h и h′ пересекаются.`,
  N1:`<b>N₁ = h₁ ∩ h′₁</b> — h и h′ на одной высоте, поэтому реально пересекаются (а не скрещиваются).`,N2:`<b>N₂</b> — по линии связи на общей линии.`,
  l2:`<b>l₂ ∥ f₂</b> через N₂.`,l1:`<b>l₁ ∥ x</b> через N₁ — у фронталей вид сверху ∥ x.`},
 build(){const Y=150,S1=P3(100,Y,Y),Fe=P3(180,34,Y),He=P3(232,Y,348),S2=P3(300,Y,Y),Fe2=P3(380,34,Y),He2=P3(178,Y,345);
  const D=new Draw();D.fill([S1,Fe,Padd(S1,Fe,He),He],"s1",0,"Σ").fill([S2,Fe2,Padd(S2,Fe2,He2),He2],"s2",0,"Ω");
  D.seg([60,Y],[440,Y],"both",0,"h₂ ≡ f₁ ≡ h′₂ ≡ f′₁",{id:"both"});
  D.seg(Fp(S1),Fp(Fe),"s1",0,"f₂",{id:"f2"}).seg(Hp(S1),Hp(He),"s1",0,"h₁",{id:"h1"}).seg(Fp(S2),Fp(Fe2),"s2",0,"f′₂",{id:"fp2"}).seg(Hp(S2),Hp(He2),"s2",0,"h′₁",{id:"hp1"});
  D.seg(Fp(S1),Fp(Fe),"hl",1,null,{e:1}).seg(Fp(S2),Fp(Fe2),"hl",1,null,{e:1});
  const N=cutH(S1,He,Hp(S2),Hp(He2));
  D.lk(N,2,{id:"N1"}).pt(Hp(N),"res",2,"N₁",{id:"N1"}).pt(Fp(N),"res",2,"N₂",{id:"N2"});
  const fd=[Fe.x-S1.x,Fe.f-S1.f];const L1=P3(N.x-fd[0]*.35,Y-fd[1]*.35,N.h),L2=P3(N.x+fd[0]*1.05,Y+fd[1]*1.05,N.h);
  D.seg(Fp(L1),Fp(L2),"res",3,"l₂",{id:"l2"});D.seg([60,N.h],[440,N.h],"res",3,"l₁",{id:"l1",s3:[L1,L2]});
  return{D,P:{N},check:{a:[S1,Fe,He],b:[S2,Fe2,He2],r:[N,P3(N.x+fd[0],N.f+fd[1],N.h)]}};},
 steps:[
  {t:"Условие",d:"<p>Обе плоскости заданы горизонталью и фронталью. На чертеже совпадают четыре проекции: h₂ ≡ f₁ ≡ h′₂ ≡ f′₁.</p>",
   why:`[[both|Средняя линия]] — сразу четыре проекции. Спереди горизонтали «лежат» (h₂, h′₂ ∥ x), сверху «лежат» фронтали (f₁, f′₁ ∥ x) — вот они и наложились. Наведи на линию и сравни с 3D: там это четыре разные прямые.`,
   mem:`<b>Горизонталь лежит спереди, фронталь лежит сверху.</b> (h₂ ∥ x, f₁ ∥ x)`},
  {t:"1. Читаем совпадения",d:"<p><b>h₂ ≡ h′₂</b> ⇒ горизонтали h и h′ на одной высоте, т.е. в одной ГПУ. <b>f₁ ≡ f′₁</b> и <b>f₂ ∥ f′₂</b> ⇒ фронтали в одной ФПУ и параллельны: f ∥ f′.</p>",al:[0],
   why:`Совпала одна проекция — совпала одна координата. h₂ ≡ h′₂ ⇒ одна высота ⇒ h и h′ на одном «этаже». f₁ ≡ f′₁ ⇒ одна глубина ⇒ f и f′ на одной «ширме» ∥ стене. Плюс [[f2,fp2|f₂ ∥ f′₂]] ⇒ f ∥ f′.`,
   alt:{q:"Может, совпадение — просто случайность рисунка?",a:"На эпюре совпадение проекций — это <b>информация</b>: одинаковая координата. Две горизонтали на одной высоте лежат в одной горизонтальной плоскости — это и даёт готовую точку."}},
  {t:"2. Общая точка N = h ∩ h′",d:"<p>h и h′ лежат в одной плоскости уровня и не параллельны ⇒ пересекаются.</p><div class='formula'>N₁ = h₁ ∩ h′₁  →  N₂ на прямой h₂ ≡ h′₂</div>",al:[1],
   why:`h и h′ на одном этаже и [[h1,hp1|сверху не параллельны]] ⇒ пересекаются: [[N1|N₁]]. N лежит на h (в Σ) и на h′ (в Ω) — общая. [[N2|N₂]] — по линии связи на общей линии.`,
   mem:`<b>Совпали проекции → подарок</b>: готовая общая точка без посредников.`},
  {t:"3. Направление: l ∥ f ∥ f′",d:"<p>В плоскостях есть параллельные прямые f и f′ ⇒ линия пересечения им параллельна.</p><div class='formula'>l₂ ∥ f₂, N₂ ∈ l₂;   l₁ ∥ f₁, N₁ ∈ l₁</div>",al:[2],
   why:`f ⊂ Σ, f′ ⊂ Ω и f ∥ f′ ⇒ линия пересечения ∥ им (правило «книги»: строчки ∥ корешку → корешок ∥ строчкам). [[l2,f2|l₂ ∥ f₂]], [[l1|l₁ ∥ x]].`,
   mem:`Две страницы, на каждой строчка ∥ корешку → корешок ∥ строчкам.`},
  {t:"4. Ответ",d:"<p>Никаких посредников не понадобилось — всё дали совпадения проекций.</p><div class='formula'>l = Σ ∩ Ω</div>",al:[3],
   why:`Проверка: [[N2|N₂]] на общей линии, [[l2,f2,fp2|l₂ ∥ f₂ ∥ f′₂]]. [[@unfold|Разложи 3D в эпюр]] — четыре прямые лягут в одну линию.`}]});

HW.push({id:"h88",num:"№ 1",tab:"Задача 1",title:"Σ(h ∩ l) и Θ(DEF)",sub:"Чтобы не путать с прямой l из условия, линию пересечения обозначим m",
 given:["Σ(h ∩ l)","Θ(△DEF)","m = Σ ∩ Θ — ?"],
 algo:[["Σ(h ∩ l) → ЧП ⊥ П₃ (h₁ ∥ h₂ ∥ x)","Θ(DEF) → ОП;  DF — горизонталь (D₂F₂ ∥ x)"],["Γ(Γ₂ ≡ h₂) ∥ П₁:  Γ ∩ Σ = h","Γ ∩ Θ = g (E ∈ Γ, g₁ ∥ D₁F₁)","h ∩ g = N"],["Γ′(Γ′₂ ≡ D₂F₂) ∥ П₁:  Γ′ ∩ Θ = DF","Γ′ ∩ Σ = k (1 ∈ l, k₁ ∥ h₁)","k ∩ DF = M"],["M ∪ N = m;  m = Σ ∩ Θ"]],

 why:{h2:`<b>h₂ ∥ x</b> — горизонталь. И [[h1|h₁ ∥ x]] ⇒ h ∥ x ⇒ Σ ⊥ П₃.`,h1:`<b>h₁ ∥ x</b> — горизонталь сверху тоже ∥ x: h ∥ оси x.`,
  DF:`<b>D₂F₂ ∥ x</b> ⇒ сторона DF — горизонталь плоскости Θ. Подсказка для второго этажа.`,G:`<b>Γ₂ ≡ h₂</b> — первый этаж проведён на высоте h: сечение Σ — сама h.`,
  g1:`<b>g₁ ∥ D₁F₁ через E₁</b> — сечение Θ этажом Γ. E на этом этаже (E₂ на Γ₂), а направление дают горизонтали Θ (DF).`,
  N1:`<b>N₁ = h₁ ∩ g₁</b> — обе прямые на этаже Γ.`,Gp:`<b>Γ′₂ ≡ D₂F₂</b> — второй этаж на высоте DF: сечение Θ — сама DF.`,
  k1:`<b>k₁ ∥ h₁ через 1₁</b> — сечение Σ вторым этажом.`,M1:`<b>M₁ = k₁ ∩ D₁F₁</b> (на продолжении DF).`},
 build(){const O=P3(216,130,326),Hs=P3(70,130,326),L=P3(124.5,235,435),Dd=P3(254,243,428),E=P3(351,130,308),F=P3(430,243,358);
  const D=new Draw();D.fill([O,Hs,L],"s1",0,"Σ");
  D.seg(Fp(Hs),Fp(O),"s1",0,"h₂",{labAt:"a",id:"h2"}).seg(Fp(O),Fp(L),"s1",0,"l₂").seg(Hp(Hs),Hp(O),"s1",0,"h₁",{labAt:"a",id:"h1"}).seg(Hp(O),Hp(L),"s1",0,"l₁").lk(O,0);
  D.poly([Fp(Dd),Fp(E),Fp(F)],"s2",0).poly([Hp(Dd),Hp(E),Hp(F)],"s2",0);
  [[Dd,E],[E,F],[F,Dd]].forEach(([p,q])=>{const o=p===F?{id:"DF"}:{};D.seg(Fp(p),Fp(q),"s2",0,null,o).seg(Hp(p),Hp(q),"s2",0,null,o);});
  D.pt(Fp(Dd),"s2",0,"D₂").pt(Fp(E),"s2",0,"E₂").pt(Fp(F),"s2",0,"F₂").pt(Hp(Dd),"s2",0,"D₁").pt(Hp(E),"s2",0,"E₁").pt(Hp(F),"s2",0,"F₁");
  [Dd,E,F].forEach(p=>D.lk(p,0));
  D.seg(Fp(Hs),Fp(O),"hl",1,null,{e:1}).seg(Fp(Dd),Fp(F),"hl",1,null,{e:1});
  const dfd=[F.x-Dd.x,F.h-Dd.h],r=dfd[1]/dfd[0];
  const N=cutH(Hs,O,Hp(E),[E.x+dfd[0],E.h+dfd[1]]);D.pl({t:"H",f:130,s:2,c:"aux",n:"Γ",id:"G"});
  D.seg([60,130],[N.x+70,130],"aux",2,"Γ₂ ≡ h₂",{id:"G",pl:"G"});D.seg(Hp(O),Hp(P3(N.x+40,130,326)),"ext1",2);
  D.seg(Hp(P3(N.x-40,130,E.h+(N.x-40-E.x)*r)),Hp(P3(E.x+55,130,E.h+55*r)),"aux",2,"g₁",{id:"g1"});
  D.lk(N,3,{id:"N1"}).pt(Hp(N),"res",3,"N₁",{id:"N1"}).pt(Fp(N),"res",3,"N₂",{id:"N1"});
  const p1=atF(O,L,243);D.pl({t:"H",f:243,s:4,c:"aux",n:"Γ′",id:"Gp"});
  D.seg([F.x+20,243],[p1.x-25,243],"aux",4,"Γ′₂ ≡ D₂F₂",{id:"Gp",pl:"Gp"});{const tt=tF(O,L,243)+.08,e2=seg2(Fp(O),Fp(L),1,tt),e1=seg2(Hp(O),Hp(L),1,tt);D.seg(e2[0],e2[1],"ext1",4).seg(e1[0],e1[1],"ext1",4);}
  D.pt(Fp(p1),"aux",4,"1₂",{id:"p1"}).lk(p1,4,{id:"p1"}).pt(Hp(p1),"aux",4,"1₁",{id:"p1"});
  const M=cutH(Dd,F,Hp(p1),[p1.x+100,p1.h]);
  D.seg(Hp(P3(p1.x-20,243,p1.h)),Hp(P3(M.x+60,243,p1.h)),"aux",4,"k₁",{id:"k1"});D.seg(Hp(Dd),Hp(P3(M.x-25,243,M.h-25*r)),"ext2",4);
  D.lk(M,5,{id:"M1"}).pt(Hp(M),"res",5,"M₁",{pref:[-8,18,"end"],id:"M1"}).pt(Fp(M),"res",5,"M₂",{pref:[-8,18,"end"],id:"M1"});
  const r2=seg2(Fp(M),Fp(N),-.3,1.35),r1=seg2(Hp(M),Hp(N),-.3,1.35);D.seg(r2[0],r2[1],"res",6,"m₂",{id:"m"}).seg(r1[0],r1[1],"res",6,"m₁",{id:"m"});
  return{D,P:{M,N},check:{a:[O,Hs,L],b:[Dd,E,F],r:[M,N]}};},
 steps:[
  {t:"Условие",d:"<p>Σ задана горизонталью h и прямой l, Θ — треугольником DEF. Построить линию пересечения m.</p>",
   why:`Σ — лист на прямых [[h2,h1|h]] и l, Θ — треугольник DEF. Обе нужно пересечь — ищем две общие точки «этажами».`},
  {t:"1. Анализ чертежа",d:"<p>h₂ и h₁ обе ∥ x ⇒ h ∥ x ⇒ <b>Σ ⊥ П₃</b>. D₂F₂ ∥ x ⇒ <b>DF — горизонталь</b> плоскости Θ. Это подсказка: посредники удобно провести через h и через DF.</p>",al:[0],
   why:`[[h2,h1|h]]: обе проекции ∥ x ⇒ h ∥ x — «шампур» ⇒ Σ ⊥ П₃. [[DF|D₂F₂ ∥ x]] ⇒ DF — горизонталь Θ. Каждая готовая горизонталь — это готовый «этаж» (половина работы уже сделана).`,

const plN=T=>V.cross(V.sub(T[1],T[0]),V.sub(T[2],T[0]));

const sideNm=(s,k,n=NM3)=>n[s[0]]+(k?SUB[k]:'')+n[s[1]]+(k?SUB[k]:'');
/* пересечения проекции прямой AB (бесконечной) со сторонами треугольника на П_k */
function sideHits(T,A,B,k,lo=0.05){const r=[];SIDES.forEach(s=>{const q=lx(PR[k](A),PR[k](B),PR[k](T[s[0]]),PR[k](T[s[1]]));if(q&&q.u>lo&&q.u<1-lo)r.push({s,t:q.t,u:q.u,P:V.lerp(T[s[0]],T[s[1]],q.u),Q:V.lerp(A,B,q.t)});});return r.sort((a,b)=>a.t-b.t);}
function inTri2(p,q){const d=(a,b,c)=>(a[0]-c[0])*(b[1]-c[1])-(b[0]-c[0])*(a[1]-c[1]);const d1=d(p,q[0],q[1]),d2=d(p,q[1],q[2]),d3=d(p,q[2],q[0]);return!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));}
/* координата плоскости «по лучу зрения»: k=1 → z над точкой (x,y); k=2 → y перед точкой (x,z) */
function plAt(T,P,k){const n=plN(T),o=T[0];if(k===1)return o[2]-(n[0]*(P[0]-o[0])+n[1]*(P[1]-o[1]))/n[2];return o[1]-(n[0]*(P[0]-o[0])+n[2]*(P[2]-o[2]))/n[1];}
/* видимость прямой AB относительно непрозрачного треугольника T на П_k */
function visSegs(T,A,B,k){const q=T.map(PR[k]);const ts=[0,1];SIDES.forEach(s=>{const r=lx(PR[k](A),PR[k](B),q[s[0]],q[s[1]]);if(r&&r.u>=0&&r.u<=1&&r.t>0&&r.t<1)ts.push(r.t);});
 const X=lineX(T,A,B);if(X&&X.t>0&&X.t<1)ts.push(X.t);ts.sort((a,b)=>a-b);const out=[];
 for(let i=0;i<ts.length-1;i++){const a=ts[i],b=ts[i+1];if(b-a<1e-6)continue;const m=V.lerp(A,B,(a+b)/2);let vis=true,inside=false;
  if(inTri2(PR[k](m),q)){inside=true;vis=k===1?m[2]>plAt(T,m,1):m[1]>plAt(T,m,2);}out.push({a,b,vis,inside});}return out;}
/* прямая l = MN: обе проекции, подписи */
function drawL(g,M,N,k,o={}){const a=PR[k](M),b=PR[k](N),c=o.c||'ink';
 if(o.vis&&o.T){visSegs(o.T,M,N,k).forEach(s=>{const p=PR[k](V.lerp(M,N,s.a)),q=PR[k](V.lerp(M,N,s.b));if(!s.vis)g.gap(p,q,{w:6});g.line(p,q,{c,w:s.vis?3:1.7,dash:s.vis?0:1});});}
 else g.line(a,b,{c,w:o.w||2.6});
 const d=lblDir(b,a,15);g.text(b,(o.n||'l')+SUB[k],{c,dx:d[0],dy:d[1],anchor:'middle',size:14.5});
 if(o.ends!==false){g.pt(a,'',{c,r:2.6});g.pt(b,'',{c,r:2.6});const e=lblDir(a,b,13);g.text(a,'M'+SUB[k],{c:'mut',dx:e[0],dy:e[1],anchor:'middle',size:12});}}
const angDeg=(a,b)=>{const u=V.norm(a),w=V.norm(b);return deg(Math.acos(clamp(Math.abs(u[0]*w[0]+u[1]*w[1]),0,1)));};
const baryPt=(T,w)=>[0,1,2].map(i=>w[0]*T[0][i]+w[1]*T[1][i]+w[2]*T[2][i]);
function randBary(lo=.18){for(;;){const a=rndf(lo,1-2*lo),b=rndf(lo,1-a-lo),c=1-a-b;if(c>=lo)return shuffle([a,b,c]);}}
/* генератор «треугольник + прямая»: kind = in | par | int */
function genLP(kind,o={}){
 for(let it=0;it<4000;it++){const T=genGenTri();let M,N;
  if(kind==='in'){const ss=shuffle(SIDES.slice());const P=V.lerp(T[ss[0][0]],T[ss[0][1]],rndf(.25,.75)),Q=V.lerp(T[ss[1][0]],T[ss[1][1]],rndf(.25,.75));const d=V.sub(Q,P);M=V.sub(P,V.mul(d,rndf(.25,.55)));N=V.add(Q,V.mul(d,rndf(.25,.55)));}
  else if(kind==='par'){const ss=shuffle(SIDES.slice());const P=V.lerp(T[ss[0][0]],T[ss[0][1]],rndf(.2,.8)),Q=V.lerp(T[ss[1][0]],T[ss[1][1]],rndf(.2,.8));const d=V.sub(Q,P);
   const K0=V.add(baryPt(T,randBary(.2)),[rnd(-4,4),(Math.random()<.5?-1:1)*rnd(8,15),(Math.random()<.5?-1:1)*rnd(5,10)]);M=V.sub(K0,V.mul(d,rndf(.55,.8)));N=V.add(K0,V.mul(d,rndf(.55,.8)));}
  else{const K=baryPt(T,randBary(.2));const dir=[rnd(-22,22),rnd(-22,22),rnd(-22,22)];if(Math.abs(dir[0])<10||Math.abs(dir[1])<6||Math.abs(dir[2])<6)continue;M=V.sub(K,V.mul(dir,rndf(.7,1.1)));N=V.add(K,V.mul(dir,rndf(.7,1.1)));}
  if(kind==='int'){M=M.map(c=>Math.round(c));N=N.map(c=>Math.round(c));}
  if(M[0]<N[0]){const t=M;M=N;N=t;}                 /* M — левее на чертеже (больше x) */
  if(!inR(M,2,58)||!inR(N,2,58)||M[0]-N[0]<16)continue;
  if(V.dist(P1(M),P1(N))<26||V.dist(P2(M),P2(N))<26)continue;

  else if(kind==='par'){if(ang>0.5||distPtLine(d1a,P1(M),P1(N))<5||Math.abs(plDist(T,M))<4)continue;}
  else{if(ang<16)continue;const X=lineX(T,M,N);if(!X||X.t<.2||X.t>.8)continue;K=X.p;tK=X.t;
   if(Math.abs(plDist(T,M))<5||Math.abs(plDist(T,N))<5)continue;
   /* конкурирующие точки: на П₁ — пересечение l₁ со стороной, на П₂ — одна из точек 1/2 внутри MN */
   const c1=sideHits(T,M,N,1,.06).filter(h=>h.t>.04&&h.t<.96&&Math.abs(h.t-tK)*V.dist(P1(M),P1(N))>7&&Math.abs(h.Q[2]-h.P[2])>3.5);
   const c2=[h1,h2].filter(h=>h.t>.04&&h.t<.96&&Math.abs(h.t-tK)*V.dist(P2(M),P2(N))>7&&Math.abs(h.Q[1]-h.P[1])>3.5);
   if(!c1.length||!c2.length)continue;
   if(o.box&&![M,N,K].every(p=>inR(p,2,58)))continue;
   return{T,M,N,H:[h1,h2],K,tK,kind,c1:c1[0],c2:c2[0]};}
  return{T,M,N,H:[h1,h2],K,tK,kind};}
 return null;}
/* «посредник Θ ⊥ П₂ через l»: этапы 1 — Θ₂ и 1₂,2₂; 2 — линии связи и 1₁,2₁; 3 — d₁; 4 — K */
function drawThetaPart(g,G,i,o={}){const{M,N,H}=G;const[h1,h2]=H;

/* видимость в 3D: часть прямой за непрозрачным треугольником — штрихом */
function vis3D(v,T,A,B){const th=v.cam.th,ph=v.cam.ph,d=[Math.sin(th)*Math.cos(ph),Math.cos(th)*Math.cos(ph),Math.sin(ph)],rr=V.norm([-Math.cos(th),Math.sin(th),0]),uu=V.cross(d,rr);
 const sc=p=>[V.dot(p,rr),V.dot(p,uu)],q=T.map(sc),n=plN(T),cs=Math.sign(V.dot(n,d));const N=120,out=[];let cur=null;
 for(let i=0;i<=N;i++){const t=i/N,P=V.lerp(A,B,t);const hid=inTri2(sc(P),q)&&Math.sign(V.dot(n,V.sub(P,T[0])))!==cs&&Math.abs(V.dot(V.norm(n),V.sub(P,T[0])))>0.05;
  if(!cur||cur.hid!==hid){if(cur){cur.b=t;out.push(cur);}cur={a:t,hid};}}cur.b=1;out.push(cur);return out;}
function clip3(A,B,L=60){const d=V.sub(B,A);let lo=-1e9,hi=1e9;for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-9){if(A[i]<0||A[i]>L)return null;continue;}let t0=(0-A[i])/d[i],t1=(L-A[i])/d[i];if(t0>t1)[t0,t1]=[t1,t0];lo=Math.max(lo,t0);hi=Math.min(hi,t1);}
 return lo<hi?[V.add(A,V.mul(d,lo)),V.add(A,V.mul(d,hi))]:null;}

function ppLab(host){host.innerHTML='';let P=null;while(!P)P=genPP();let z=Math.round((P.lo+P.hi)/2);const{T1,T2}=P;

  const r=lx(P1(pa[0]),P1(pa[1]),P1(pb[0]),P1(pb[1]));return r?{pa,pb,A0,B0,X:[-r.p[0],-r.p[1],zz]}:null;};

  const L=lvl(z);const a=hLine(n1,d1,z),b=hLine(n2,d2,z);if(a)it.push({k:'seg',a:a[0],b:a[1],c:'p1',w:2.4,label:'m'});if(b)it.push({k:'seg',a:b[0],b:b[1],c:'teal',w:2.4,label:'n'});

 const ep=new Ep(g.children[1],{maxH:380});ep.fit(ppPts(P),9);

  [[L.pa,L.A0,'c1','m₁'],[L.pb,L.B0,'teal','n₁']].forEach(([pp,H0,c,nm])=>{if(H0)pp.forEach(p=>{gg.link(P2(p),P1(p),{c});gg.pt(P2(p),'',{c,r:3});gg.pt(P1(p),'',{c,r:3});});spanLine(gg,[P1(pp[0]),P1(pp[1]),P1(L.X)],{c,w:2.2,label:nm});});

S('p5th',MP5,'Линия пересечения плоскостей: метод этажей',root=>{
 H(root,`<div class="kicker">Практика 5 · 8.10.26</div><h1>Пересечение плоскостей</h1>
 <div class="rule"><div class="t">Из конспекта</div>Общая точка определяется с помощью дополнительной плоскости <b>ЧП</b>, заданной следом. Находятся линии пересечения дополнительной плоскости с каждой из заданных плоскостей. Точка пересечения этих линий — <b>общая</b> для заданных и дополнительной плоскостей.</div>
 <div class="grid2"><div class="card"><b>Общий алгоритм</b><ol class="l5alg"><li><span>Определить положение плоскостей: ОП или ЧП.</span></li><li><span>Посредник Γ ∥ П₁: Γ ∩ Σ = m, Γ ∩ Ω = n, <b>m ∩ n = M</b>.</span></li><li><span>Посредник Γ′: так же находим <b>N</b>.</span></li><li><span><b>l = MN</b>.</span></li></ol></div>
 <div class="mem"><div class="t">Метод «этажей»</div>Посредник Γ — этаж здания. Каждая плоскость оставляет на этаже свою линию (горизонталь), и там, где линии встретились, лежит общая точка. <b>Два этажа → две точки → линия.</b></div></div>
 <h2>Лаборатория: двигай этаж</h2><p class="cmut">На любом этаже горизонтали m и n пересекаются в точке, которая всегда попадает на одну и ту же прямую l (пунктир). Поэтому двух этажей хватает.</p>`);
 ppLab(box(root));
 H(root,`<div class="grid2"><div class="why"><div class="t">Когда хватает одной точки</div>Если в обеих плоскостях есть <b>параллельные прямые</b> (например, обе содержат горизонтали — а ГПУ тоже!), то l им параллельна → нужна одна точка + направление (задачи 1, 3, 4 практики и задача 4 ДЗ).</div>
 <div class="why"><div class="t">Когда точка уже готова</div>Если проекции прямых двух плоскостей <b>совпали</b> (h₂ ≡ h′₂), эти прямые лежат в одной плоскости уровня и сразу пересекаются: точка h ∩ h′ — общая (задача 4 практики и задача 3 ДЗ).</div></div>
 <table class="tb"><tr><th>Сокращение</th><th>Значит</th><th>Что даёт</th></tr><tr><td>ОП / ЧП</td><td>общего / частного положения</td><td>с ЧП одна проекция l известна сразу</td></tr>
 <tr><td>ГПУ</td><td>горизонтальная плоскость уровня, ∥ П₁ (Γ₂ ∥ x)</td><td>Γ ∩ Σ — горизонталь Σ; l₂ ≡ Γ₂, l₁ ∥ h₁</td></tr>
 <tr><td>ФПУ</td><td>фронтальная плоскость уровня, ∥ П₂ (Φ₁ ∥ x)</td><td>Φ ∩ Σ — фронталь Σ; l₁ ≡ Φ₁, l₂ ∥ f₂</td></tr>
 <tr><td>⊥ П₁ (Σ₁)</td><td>горизонтально-проецирующая</td><td>l₁ ≡ Σ₁ (как в Л4)</td></tr><tr><td>⊥ П₃</td><td>профильно-проецирующая</td><td>содержит прямые ∥ x; l ∥ x, если обе ⊥ П₃</td></tr></table>`);

function solNV(k,prof){
 let A,B;for(let i=0;i<900;i++){if(prof){const x=rnd(18,42);A=[x,rnd(6,50),rnd(6,50)];B=[x,rnd(6,50),rnd(6,50)];if(Math.abs(A[1]-B[1])>=12&&Math.abs(A[2]-B[2])>=12)break;}

 const c=DLK[k],Gk=GRK[k],s=SUB[k];const dyy=Math.abs(A[1]-B[1]);

 const S=[];
 S.push({s:'Дано',t:`Даны проекции A₁B₁ и A₂B₂. Найти <b>натуральную величину</b> AB и угол <b class="cang">${Gk}</b> — наклон к П${s}.`+(prof?'<br>Обе проекции на одной линии связи — это <b>профильная прямая</b> (как задачи 3 и 6). Метод тот же.':'')});

 }else{

  S.push({s:'Δy → B₃',t:'По горизонтали на П₃ откладывается <b>глубина</b>. Разность глубин <b class="cdd">Δy</b> берём на П₁ и циркулем откладываем от A₃ по горизонтали — на горизонтали B₂ получаем <b>B₃</b>. Кто ближе к нам (ниже на П₁), тот правее на П₃.',
   d:g=>{drawBr(g,dBr(A,B,'y'),{c:'dd',label:'Δy'});g.link(a3,[U3,B[2]],{c:'dd'});g.bracket([U3,B[2]],b3,{c:'dd'});g.line(a3,b3,{c:'c3',w:2.6});g.pt(b3,'B₃',{c:'c3',lp:lblDir(b3,a3)});}});

 }

/* Б1. Дан угол к той плоскости, где проекция дана целиком */
function solAng1(){
 for(let tr=0;tr<500;tr++){const k=pick([1,2]),q=3-k,c=DLK[k],Gk=GRK[k],s=SUB[k],sq=SUB[q];const[A,B]=genGeneral(10);const phi=pick([30,45,60]);

   drawPts(g,[{p:a,label:'A'+s,c:'c'+k,lp:lblDir(a,b)},{p:b,label:'B'+s,c:'c'+k,lp:lblDir(b,a)},{p:aq,label:'A'+sq,c:'c'+q,lp:[-22,-6]}]);};

/* Б2. Дан угол к «чужой» плоскости */

function solLen(){

 <div class="rule"><div class="t">Вся начерталка в 5 мыслях</div><ol>
 <li><b>Индекс = вид.</b> ₁ — сверху, ₂ — спереди, ₃ — слева.</li>
 <li><b>Параллельно плоскости → натуральная величина.</b> Перпендикулярно → прямая становится точкой, плоскость — линией.</li>
 <li><b>Наклонно → короче.</b> Вернуть НВ помогает прямоугольный треугольник.</li>
 <li><b>Принадлежность — через линии связи.</b> Точка в плоскости → на прямой этой плоскости.</li>
 <li><b>Нет общей точки — нужен посредник.</b> Прямую заключают в проецирующую плоскость или режут плоскости «этажами».</li></ol></div>
 <div class="mem"><div class="t">Линии везде одинаковые</div><span class="c1">П₁ (сверху) — контрастный тон</span> · <span class="c2">П₂ (спереди) — приглушённый</span> · <span class="c3">П₃ (слева) — бледный</span> · <span class="cnv">НВ — жирная</span> · <span class="cdd">Δ — бледная жирная</span> · <span class="cang">углы — дуга</span></div>`);
  const t=root.querySelector('.toc');modsList().forEach(g=>{if(g.mod==='Старт')return;const w=el(`<div class="toc-g"><div class="toc-h">${g.mod.replace(EMO4,'')}</div></div>`);g.items.forEach(x=>{const a=el(`<button class="toc-i">${x.t}</button>`);a.onclick=()=>go(x.id);w.appendChild(a);});t.appendChild(w);});};})();
/* 5. Точка на прямой — по шагам; обратные задачи — те же решения без осей */
function solPoint(){const[A,B]=genGeneral(12);const t=rndf(.3,.7);const M=V.lerp(A,B,t);const v=pick(['on','off2','off1']);const sh=pick([-1,1])*rnd(7,11);
 const M1=v==='off1'?V.add(P1(M),[0,sh]):P1(M),M2=v==='off2'?V.add(P2(M),[0,sh]):P2(M);
 const pts=[P1(A),P1(B),P2(A),P2(B),M1,M2];
 const base=g=>{drawSeg2(g,A,B);g.link(M1,M2);g.pt(M1,'M₁',{c:'c1',lp:[8,12]});g.pt(M2,'M₂',{c:'c2',lp:[8,-12]});};
 const on2=v!=='off2',on1=v!=='off1';
 const S=[{s:'Дано',t:'Даны проекции прямой AB и точки M. Лежит ли M на AB?'},
  {s:'Правило',t:'Точка лежит на прямой ⇔ <b>каждая</b> её проекция лежит на одноимённой проекции прямой: M₁ на A₁B₁ <b>и</b> M₂ на A₂B₂. M₁ и M₂ всегда на одной линии связи.'},
  {s:'Смотрим П₂',t:on2?'M₂ лежит на A₂B₂ — на виде спереди точка на прямой.':`M₂ <b>не</b> лежит на A₂B₂ — точка ${sh>0?'выше':'ниже'} прямой.`,d:g=>{if(g.hl)g.ring(M2,on2?'nv':'ang');}},
  {s:'Смотрим П₁',t:on1?'M₁ лежит на A₁B₁ — на виде сверху тоже на прямой.':`M₁ <b>не</b> лежит на A₁B₁ — точка ${sh>0?'дальше от нас':'ближе к нам'}, чем прямая.`,d:g=>{if(g.hl)g.ring(M1,on1?'nv':'ang');}},
  {s:'Вывод',t:on1&&on2?'<b>M ∈ AB</b>: обе проекции на месте.':`<b>M ∉ AB</b>: одной проекции «на месте» мало — на ${on1?'П₂':'П₁'} точка мимо прямой. Как бусина рядом с ниткой: с одной стороны кажется, что на нитке, а с другой — видно, что нет.`}];
 return{box:bbox(pts),base,steps:S};}
function mountSol(root,list,lead){const top=el('<div class="sol-top"></div>');root.appendChild(top);const host=el('<div></div>');root.appendChild(host);let cur=list[0][0];

<style>
/* ===== v5: читаемость и интерфейс ===== */
html.dark{
 --bg:#131313;--card:#1e1e1e;--soft:#272727;--soft2:#313131;--line:#3e3e3e;--ink:#ececec;--mut:#b1b1b1;
 --accs:#323232;--acc:#a7a7a7;--goods:#2e2e2e;--bads:#2b2b2b;--warn:#343434;--why:#2b2b2b;
 --grid:#252525;--grid2:#323232;--shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px rgba(0,0,0,.35);
}
:root{--line:#d7d7d7;--mut:#666666}
html{scroll-padding-top:70px}
body{font-size:16.5px;line-height:1.65}
::selection{background:color-mix(in srgb,var(--acc) 35%,transparent)}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:6px}
main{padding:30px 34px 90px}
.sec p,.sec li{max-width:78ch}

.sec h2{font-size:22px;margin:38px 0 12px;padding-top:16px;border-top:1px solid var(--line)}

.sec h3{font-size:17.5px;margin:22px 0 8px}
.lead{color:var(--mut);font-size:17.5px;max-width:72ch}
b,strong{color:color-mix(in srgb,var(--ink) 100%,transparent)}
html.dark header{background:#1a1a1a}
/* ---- callout-блоки: у каждого типа свой тон, чтобы не сливались ---- */
.hook,.why,.rule,.mem,.trap{border:1px solid var(--line)!important;border-left-width:4px!important;border-radius:12px!important;padding:12px 18px!important;margin:16px 0!important}
.hook{background:color-mix(in srgb,var(--acc) 8%,var(--card))!important;border-left-color:var(--acc)!important}
.why{background:color-mix(in srgb,var(--whyb) 8%,var(--card))!important;border-left-color:var(--whyb)!important}
.rule{background:color-mix(in srgb,var(--good) 9%,var(--card))!important;border-left-color:var(--good)!important}
.mem{background:color-mix(in srgb,var(--dd) 10%,var(--card))!important;border-left-color:var(--dd)!important}
.trap{background:color-mix(in srgb,var(--bad) 8%,var(--card))!important;border-left-color:var(--bad)!important}
.hook .t,.why .t,.rule .t,.mem .t,.trap .t{font-size:12.5px!important;font-weight:800!important;text-transform:uppercase!important;letter-spacing:.06em!important;margin-bottom:4px}
.hook .t{color:var(--acc)}.why .t{color:var(--whyb)}.rule .t{color:var(--good)}.trap .t{color:var(--bad)}
html:not(.dark) .mem .t{color:#6d6d6d!important}
.card{border-radius:16px;box-shadow:var(--shadow)}
html.dark .card,html.dark .l5card,html.dark .l5step{background:#212121;border-color:var(--line)}
details.fold{background:var(--card)}
details.fold>summary{color:var(--ink);opacity:.85}
/* таблицы */
table.tb{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tb th{background:var(--soft2)!important;font-size:13.5px;text-transform:none}
.tb tr:nth-child(even) td{background:color-mix(in srgb,var(--soft) 55%,var(--card))}
.tb tr:hover td{background:var(--accs)}
/* сегменты/кнопки */
.seg{background:var(--soft);border-color:var(--line)}
.seg button{color:var(--mut)}
.seg button:hover{color:var(--ink)}
.seg button.on{color:var(--acc);background:var(--card);box-shadow:0 0 0 1px var(--line),var(--shadow)}
/* чертежи крупнее */
.l5fig svg{max-height:min(66vh,640px)!important}
.l5main.m-both .l5fig svg{max-height:min(50vh,520px)!important}

nav#side{background:var(--card);padding:0 12px 40px;width:300px;scrollbar-width:thin}

.nav-top{position:sticky!important;top:0!important;margin:0 -12px 8px!important;padding:12px 12px 10px!important;background:inherit!important;z-index:3!important;border-bottom:1px solid var(--line)}
html.dark .nav-top{background:#1a1a1a!important}
html:not(.dark) .nav-top{background:var(--card)!important}
.modg{margin:2px 0 6px;padding-bottom:6px}
.modg+.modg{border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);padding-top:6px}
.modh{margin:2px 0!important;padding:8px 8px!important;font-size:11.5px!important;letter-spacing:.07em!important;color:var(--mut)!important;font-weight:800!important}
.modh .lch{font-size:11px;letter-spacing:0;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--soft2);color:var(--ink);text-transform:none}
.modg.hasOn .modh{color:var(--acc)!important}
.modg.hasOn .modh .lch{background:var(--acc);color:var(--onacc)}
html.dark .modg.hasOn .modh .lch{color:#131313}
.modb{margin:0 0 0 12px;padding-left:8px;border-left:2px solid var(--line)}
.navi{position:relative;padding:7px 10px!important;margin:1px 0;font-size:14.5px!important;color:color-mix(in srgb,var(--ink) 88%,var(--mut));border-radius:8px!important}
.navi:hover{background:var(--soft)!important;color:var(--ink)}
.navi.on{background:var(--accs)!important;color:var(--ink)!important;font-weight:650}
.navi.on::before{content:"";position:absolute;left:-10px;top:5px;bottom:5px;width:3px;border-radius:3px;background:var(--acc)}
.navi .nt{flex:1}
.navi.done .nt::after{content:"  ✓";color:var(--good);font-weight:800}
.navi .hwp{font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:1px 6px;border-radius:6px;border:1px solid color-mix(in srgb,var(--dd) 70%,transparent);color:var(--dd);flex:none}
html:not(.dark) .navi .hwp{color:#6d6d6d;border-color:#9f9f9f88;background:#f6f6f6}
.navi.new::after{margin-left:6px}
.nsearch{background:var(--soft)!important;border-color:var(--line)!important}
/* ---- новый раздел ДЗ Л4 ---- */
.hw-sheet{display:flex;gap:14px;align-items:flex-start;margin:12px 0;padding:10px;border:1px dashed var(--line);border-radius:12px;background:var(--soft)}
.hw-sheet img{width:150px;max-width:40%;border-radius:8px;background:#ffffff;flex:none;border:1px solid var(--line)}
.hw-sheet .t{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:3px}
.hw-sheet>div{font-size:14px;line-height:1.5}
.hw-far{color:var(--dd);font-size:13px;margin-top:6px}
html:not(.dark) .hw-far{color:#6d6d6d}
.v5app{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.v5app>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative}
.v5app .L{font-size:30px;font-weight:900;line-height:1;color:var(--acc);font-family:Georgia,serif}
.v5app .n{font-weight:750;margin:4px 0 2px}
.v5app .d{font-size:13.5px;color:var(--mut);line-height:1.45}
.v5tree{display:grid;gap:8px;margin:10px 0}
.v5tree .q{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.v5tree .q .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--accs);color:var(--acc)}
.v5tree .q .a{font-size:14.5px}
.v5tree .q .a span{display:inline-block;margin:3px 6px 0 0;padding:1px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:13px}
.v5sci{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:10px 0}
.v5sci>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.5}
.v5sci b{display:block;margin-bottom:3px}

.v5hooks>div{border-radius:12px;padding:10px 14px;background:color-mix(in srgb,var(--dd) 9%,var(--card));border:1px solid var(--line);border-left:4px solid var(--dd);font-size:14.5px}
.v5rnd{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn5{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:650}
.btn5:hover{border-color:var(--acc);color:var(--acc)}
.btn5.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
html.dark .btn5.pri{color:#131313}
.tb tr.go5{cursor:pointer}
@media (max-width:900px){main{padding:18px 14px 80px}.v5app{grid-template-columns:1fr 1fr}.hw-sheet{flex-direction:column}.hw-sheet img{max-width:100%;width:200px}.modb{margin-left:6px}}

/* =====================================================================
   v5 · ДЗ к лекции 4: Тема 3 «Принадлежность», 
   Координаты сняты с фото листа (безосный чертёж): x — вправо,
   f — экранная высота вида спереди, h — экранная высота вида сверху.
   ===================================================================== */
const HW4=(()=>{'use strict';
const {Draw}=L5V;
const P3=(x,f,h)=>({x,f,h});
const L3=(a,b,t)=>P3(a.x+(b.x-a.x)*t,a.f+(b.f-a.f)*t,a.h+(b.h-a.h)*t);
const ad=(a,d,k=1)=>P3(a.x+d.x*k,a.f+d.f*k,a.h+d.h*k);
const sb=(a,b)=>P3(a.x-b.x,a.f-b.f,a.h-b.h);
const tg=(r,p,k)=>{r.src=p;r.pk=k;return r;};
const Fp=p=>tg([p.x,p.f],p,2),Hp=p=>tg([p.x,p.h],p,1);
/* точка плоскости K + a·d1 + b·d2 с заданными x и f (или h) */
function onPl(K,d1,d2,x,v,key){const det=d1.x*d2[key]-d1[key]*d2.x,r0=x-K.x,r1=v-K[key];const a=(r0*d2[key]-r1*d2.x)/det,b=(d1.x*r1-d1[key]*r0)/det;return{a,b,p:ad(ad(K,d1,a),d2,b)};}
/* пересечение прямых PQ и RS по проекции k (1 — сверху, 2 — спереди) */
function X(P,Q,R,S,k){const g=k===1?'h':'f';const r=[Q.x-P.x,Q[g]-P[g]],s=[S.x-R.x,S[g]-R[g]],den=r[0]*s[1]-r[1]*s[0];const q=[R.x-P.x,R[g]-P[g]];const t=(q[0]*s[1]-q[1]*s[0])/den,u=(q[0]*r[1]-q[1]*r[0])/den;return{t,u,p:L3(P,Q,t),q:L3(R,S,u)};}
/* точка прямой PQ с заданным x */
const atX=(P,Q,x)=>L3(P,Q,(x-P.x)/(Q.x-P.x));
/* «оба вида» */
function seg2(D,P,Q,c,s,n,o={}){D.seg(Fp(P),Fp(Q),c,s,n?n+'₂':null,Object.assign({},o));D.seg(Hp(P),Hp(Q),c,s,n?n+'₁':null,Object.assign({},o));return D;}
function pt2(D,P,c,s,n,o={}){D.lk(P,s,{id:o.lid||o.id});D.pt(Fp(P),c,s,n+'₂',Object.assign({},o,o.pf?{pref:o.pf}:{}));D.pt(Hp(P),c,s,n+'₁',Object.assign({},o,o.ph?{pref:o.ph}:{}));return D;}
/* данная проекция точки — без 3D (чтобы 3D не подсказывал ответ) */
const given=(D,xy,n,id)=>D.pt([xy[0],xy[1]],'both',0,n,{id});
const LEG=(n,m)=>[["plane",n],...(m?[["teal",m]]:[]),["aux","посредник, перенос"],["res","ответ"]];
const NUM3={"3-60": 1, "3-53": 2, "3-54": 3, "3-55": 4, "3-56": 5, "3-57": 6, "3-58": 7, "3-59": 8, "3-61": 9, "3-62": 10};const IMGW=no=>`<div class="hw-sheet"><img src="${DZIMG4[no]}" alt="Условие задачи ${NUM3[no]}" loading="lazy"><div><div class="t">Условие · задача ${NUM3[no]}</div>`;
const sheet=(no,txt,extra='')=>`${IMGW(no)}<p>${txt}</p>${extra}</div></div>`;
const FAR='<p class="hw-far">A₂ стоит низко, поэтому A₁ уходит <b>выше верхнего края листа</b>. Это не ошибка: продли прямую — она бесконечна. На своём листе продлевай тонко и аккуратно.</p>';
const T=[];

/* ---------------- ★  ---------------- */
{const k=(307-258)/(217-61),B=P3(61,120,258),C=P3(121,50,258+k*60),D=P3(217,198,307),A=P3(168,45,258+k*107);
const one=X(B,A,C,D,2).q;
T.push({id:'d60',num:'№ 1',tab:'Задача 1',title:'Θ(△BCD), дана A₂ — найти A₁',sub:'Плоскость частного положения — хватает одной линии связи',
 given:['Θ(△BCD)','A ∈ Θ;  A₂','A₁ — ?'],
 algo:[['B₁, C₁, D₁ — на одной прямой','⇒ Θ ⊥ П₁ (горизонтально-проецирующая)'],['Θ₁ ≡ B₁D₁;  A ∈ Θ ⇒ A₁ ∈ Θ₁'],['A₁ = (линия связи из A₂) ∩ Θ₁']],
 legend:LEG('Θ(△BCD)'),
 sheet:sheet('3-60','Вверху B₂C₂D₂ — обычный треугольник, правее C₂ — точка A₂. Внизу B₁, C₁, D₁ лежат <b>на одном отрезке</b> (C₁ — посередине). A₁ нет — её и строим. Подпись плоскости: Θ(△BCD).'),
 answer:'A₁ лежит на Θ₁ (прямая B₁D₁) строго под A₂ — между C₁ и D₁.',
 checks:['A₁ и A₂ на одной вертикали','A₁ на прямой B₁D₁','A₂ вне треугольника — это нормально: плоскость бесконечна'],
 why:{A2g:'<b>A₂</b> — дано. Это точка A на виде спереди. Где она сверху — пока неизвестно: под A₂ годится любая точка вертикали, пока не вспомним, что A ∈ Θ.',
  T1:'<b>Θ₁</b> — плоскость сверху видна «ребром»: весь треугольник слипся в эту черту. Всё, что лежит в Θ, сверху попадает на неё (собирательное свойство).',
  lkA:'<b>Линия связи точки A.</b> A₁ и A₂ — проекции одной точки: общий x ⇒ одна вертикаль.',
  A1:'<b>A₁ = линия связи ∩ Θ₁.</b> Точка обязана быть и на вертикали из A₂, и на черте Θ₁. Две прямые пересекаются в одной точке — ответ единственный.',
  c1:'<b>l = B–A</b> — проверочная прямая «общего способа».',c12:'<b>1</b> = l ∩ CD — вторая общая точка проверочной прямой.'},
 build(){const Dr=new Draw();Dr.fill([B,C,D],'s1',0,'Θ');
  Dr.poly([Fp(B),Fp(C),Fp(D)],'s1',0);[[B,C],[C,D],[D,B]].forEach(([p,q])=>Dr.seg(Fp(p),Fp(q),'s1',0));
  Dr.seg(Hp(B),Hp(D),'s1',0,null,{id:'BD1'});
  pt2(Dr,B,'s1',0,'B',{pf:[-8,-6,'end'],ph:[-8,16,'end']});pt2(Dr,C,'s1',0,'C',{pf:[0,-12,'middle'],ph:[0,22,'middle']});pt2(Dr,D,'s1',0,'D',{pf:[8,16,'start'],ph:[8,16,'start']});
  given(Dr,[A.x,A.f],'A₂','A2g');
  Dr.seg(Hp(B),Hp(D),'hl',1,null,{e:1});
  Dr.seg(Hp(L3(B,D,-.12)),Hp(L3(B,D,1.12)),'aux',2,'Θ₁',{id:'T1',lc:'lbl a'});
  Dr.lk(A,2,{id:'lkA'});
  Dr.pt(Hp(A),'res',3,'A₁',{id:'A1',pref:[8,20,'start']});Dr.pt(Fp(A),'res',3,'A₂',{id:'A1',no3dlab:0});
  return{D:Dr,P:{A,B,C,D,one}};},
 steps:[
  {t:'Условие',d:'<p>Плоскость Θ задана треугольником BCD (даны обе проекции). От точки A известна только A₂. Найти A₁, если A ∈ Θ.</p>',al:[],
   why:'Одна проекция не задаёт точку: под [[A2g|A₂]] — целая вертикаль возможных A₁. Условие «A ∈ Θ» выберет на ней одну точку.',
   ask:{q:'Посмотри на вид сверху. Что в нём необычного?',a:'B₁, C₁ и D₁ лежат на одной прямой — треугольник сверху «сплющился» в отрезок. Это сигнал: плоскость частного положения.'}},
  {t:'1. Анализ: Θ ⊥ П₁',d:"<div class='formula'>B₁, C₁, D₁ ∈ одной прямой ⇒ Θ ⊥ П₁</div><p>Черта наклонная (∦ краю листа) ⇒ плоскость <b>проецирующая</b>, а не уровня.</p>",al:[0],
   why:'Треугольник сверху виден ребром — значит, он стоит вертикально, как стена. [[@top|Посмотри в 3D сверху]] — стена превратится в линию [[BD1|B₁D₁]].',
   mem:'<b>«Слиплось + наклонно = проецирующая. Слиплось + ровно (∥ x) = уровня».</b>',
   alt:{q:'А если бы B₁C₁D₁ слиплись в линию ∥ краю листа?',a:'Тогда Θ ∥ П₂ — фронтальная плоскость уровня (спереди треугольник в натуральную величину). Решение то же: линия связи до этой черты.'}},
  {t:'2. Собирательное свойство',d:"<div class='formula'>Θ₁ ≡ B₁D₁;  A ∈ Θ ⇒ A₁ ∈ Θ₁</div><p>Из A₂ ведём вертикальную линию связи вниз до Θ₁.</p>",al:[1],
   why:'Всё, что висит на «стене», сверху видно на её черте [[T1|Θ₁]]. Значит, A₁ ищем только на ней — посредник не нужен. [[lkA|Линия связи]] — строго вертикально, угольником от края листа.',
   alt:{q:'А почему не через горизонталь, как в других задачах?',a:'Можно, но это лишняя работа: у проецирующей плоскости любая прямая сверху всё равно ляжет на Θ₁. Меньше построений — меньше шансов ошибиться.'},
   ask:{q:'Где окажется A₁: внутри отрезка B₁D₁ или снаружи?',a:'Внутри, между C₁ и D₁: вертикаль из A₂ проходит правее C и левее D.'}},
  {t:'3. Ответ: A₁',d:"<div class='formula'>A₁ = (линия связи из A₂) ∩ Θ₁</div>",al:[2],
   why:'[[A1|A₁]] одновременно на вертикали из A₂ и на черте Θ₁ — это ровно одна точка. [[@iso|В 3D]] A лежит на «стене», но <b>вне</b> треугольника: плоскость бесконечна.',
   alt:{ok:1,q:'Проверить «общим способом» — через прямую',a:'Прямая l = B–A: спереди [[c1|l₂]] пересекает C₂D₂ в точке [[c12|1₂]] → вниз на C₁D₁ → 1₁. Прямая B₁1₁ совпала с Θ₁, и A₁ на ней — тот же ответ, только длиннее.',
    build(B){const{A,B:Bv,one}=B.P,D=new Draw();D.seg(Fp(Bv),Fp(L3(Bv,A,1.08)),'chk',0,'l₂',{id:'c1'}).pt(Fp(one),'chk',0,'1₂',{id:'c12'}).lk(one,0,{id:'c12'}).pt(Hp(one),'chk',0,'1₁',{id:'c12'});D.seg(Hp(Bv),Hp(L3(Bv,A,1.08)),'chk',0,null,{id:'c1'});return D;}},
   mem:'Ответ = <b>«вертикаль ∩ черта»</b>.'},
  {t:'4. Запись в тетради',d:"<div class='formula'>Θ(△BCD) → ЧП, Θ ⊥ П₁ (B₁, C₁, D₁ ∈ одной прямой)<br>A ∈ Θ ⇒ A₁ ∈ Θ₁ ≡ B₁D₁<br>A₁ = линия связи (A₂) ∩ Θ₁</div><p>Заданное обводи основной линией, построения — тонкой.</p>",al:[],
   why:'<b>Объясни вслух за 60 секунд</b> (метод Фейнмана): «Сверху B₁, C₁, D₁ на одной прямой — плоскость горизонтально-проецирующая. Все её точки сверху на этой прямой. A ∈ Θ ⇒ A₁ на B₁D₁. A₁ и A₂ на одной вертикали. Пересечение — ответ. A₂ вне треугольника не мешает: плоскость бесконечна». Где споткнулся — там слабое место.',
   mem:'<b>План дома</b>: стена на плане — просто линия. Где бы на стене ни висела картина, на плане она на линии стены.'}]});}

{const B=P3(60,67,258),C=P3(132,20,327),D=P3(215,108,185),A=onPl(B,sb(C,B),sb(D,B),245,305,'f').p;

T.push({id:'d53',num:'№ 2',tab:'Задача 2',title:'Σ(△BCD), дана A₂ — найти A₁',sub:'Плоскость общего положения: нужна прямая-посредник',
 given:['Σ(△BCD)','A ∈ Σ;  A₂','A₁ — ?'],
 algo:[['Σ(△BCD) → ОП: обе проекции — треугольники'],['l ∋ C, A:  l₂ = C₂A₂;  1₂ = l₂ ∩ B₂D₂'],['1₂ → 1₁ ∈ B₁D₁;  l₁ = C₁1₁ (продлить)'],['A₁ = (линия связи из A₂) ∩ l₁']],
 legend:LEG('Σ(△BCD)'),
 sheet:sheet('3-53','B₂C₂D₂ и B₁C₁D₁ — два нормальных треугольника, вершины связаны линиями связи. A₂ — справа внизу, правее D. Подпись плоскости не видна — пиши Σ(△BCD).',FAR),
 answer:'A₁ = линия связи из A₂ ∩ l₁, где l₁ = C₁1₁. Она выше верхнего края листа.',
 checks:['1₁ лежит на B₁D₁ строго под 1₂','C₁, 1₁ и A₁ на одной прямой','A₁ и A₂ на одной вертикали'],
 why:{A2g:'<b>A₂</b> — дано: точка A спереди. Сверху её место ищем.',l2:'<b>l₂ = C₂A₂</b> — посредник через вершину C: одна его точка (C) уже известна в обеих проекциях.',p1:'<b>1</b> = l ∩ BD. Лежит на стороне BD ⇒ 1₁ на B₁D₁.',l1:'<b>l₁ = C₁1₁</b> — у l две общие точки с плоскостью (C и 1) ⇒ l ⊂ Σ.',A1:'<b>A₁</b> = линия связи из A₂ ∩ l₁: A ∈ l ⇒ A₁ ∈ l₁.',bad:'Посредник через D пересекает B₂C₂ только на продолжении далеко за C — пересечение под острым углом, точка неточная.'},
 build(){const Dr=new Draw();Dr.fill([B,C,D],'s1',0,'Σ');Dr.poly([Fp(B),Fp(C),Fp(D)],'s1',0).poly([Hp(B),Hp(C),Hp(D)],'s1',0);
  [[B,C],[C,D],[D,B]].forEach(([p,q])=>seg2(Dr,p,q,'s1',0,null,{id:p===D?'BD':undefined}));
  pt2(Dr,B,'s1',0,'B');pt2(Dr,C,'s1',0,'C');pt2(Dr,D,'s1',0,'D');given(Dr,[A.x,A.f],'A₂','A2g');
  Dr.seg(Fp(C),Fp(A),'aux',2,'l₂',{id:'l2',labAt:'b'});Dr.pt(Fp(one),'aux',2,'1₂',{id:'p1'});
  Dr.lk(one,3,{id:'p1'});Dr.pt(Hp(one),'aux',3,'1₁',{id:'p1'});
  Dr.seg(Hp(C),Hp(one),'aux',4,null,{id:'l1'});Dr.seg(Hp(one),Hp(L3(C,A,1.04)),'exta',4,'l₁',{id:'l1'});
  Dr.lk(A,5,{id:'A1'});Dr.pt(Hp(A),'res',5,'A₁',{id:'A1'});Dr.pt(Fp(A),'res',5,'A₂',{id:'A1'});
  return{D:Dr,P:{A,B,C,D,one,bad}};},
 steps:[
  {t:'Условие',d:'<p>Σ задана треугольником BCD. Известна A₂, найти A₁ (A ∈ Σ).</p>',al:[],why:'[[A2g|A₂]] стоит снаружи треугольника — это нормально: треугольник лишь задаёт бесконечную плоскость.',
   ask:{q:'Слиплась ли плоскость в линию хоть на одном виде?',a:'Нет: и B₁C₁D₁, и B₂C₂D₂ — нормальные треугольники. Значит, общее положение и «бесплатной» черты, как в задаче 1, нет.'}},
  {t:'1. Анализ: Σ — общего положения',d:"<div class='formula'>Σ(△BCD) → ОП</div><p>Опустить линию связи из A₂ можно, но где на ней остановиться — неизвестно.</p>",al:[0],
   why:'Точке нужны «рельсы» — прямая плоскости, на которой она лежит. Построим такую прямую через A.',mem:'<b>Точке нужны рельсы.</b> Сама по себе она «висит» где угодно на линии связи. Положи её на прямую плоскости — и место однозначно.',
   alt:{q:'Чем это отличается от задачи 1?',a:'В задаче 1 треугольник сверху слипся в отрезок — хватило одной линии связи. Здесь так нельзя: нужна прямая-посредник.'}},
  {t:'2. Посредник: l₂ через C₂ и A₂',d:"<div class='formula'>l ∋ C, A;  l₂ = C₂A₂;  1₂ = l₂ ∩ B₂D₂</div>",al:[1],
   why:'Через вершину удобно: точка [[l2|C]] посредника уже известна в обеих проекциях. Прямая C₂A₂ пересекает сторону B₂D₂ внутри — в точке [[p1|1₂]], пересечение чёткое.',
   alt:{q:'А почему не через D₂, как в старом разборе?',a:'Прямая D₂A₂ встречает B₂C₂ только на продолжении далеко за C₂ (бледный штрих) — под острым углом, точка выйдет неточной. Выбирай посредник, который режет сторону <b>внутри</b>.',
    build(B){const{D,bad,C,B:Bv,A}=B.P,Dr=new Draw();Dr.seg(Fp(A),Fp(bad),'bad',0,'D₂A₂ ?',{id:'bad'}).seg(Fp(C),Fp(bad),'bad',0,null,{id:'bad'}).pt(Fp(bad),'bad',0,'1₂ ?',{id:'bad'});return Dr;}}},
  {t:'3. Перенос: 1₂ → 1₁',d:"<div class='formula'>1 ∈ BD ⇒ 1₁ ∈ B₁D₁</div><p>Из 1₂ — линия связи вниз до B₁D₁.</p>",al:[2],why:'Точка на прямой ⇒ проекции на проекциях прямой: [[p1|1]] на BD, поэтому 1₁ на [[BD|B₁D₁]].'},
  {t:'4. l₁ = C₁1₁ и продлеваем',d:"<div class='formula'>C ∈ Σ, 1 ∈ Σ ⇒ l ⊂ Σ</div><p>Соединяем C₁ с 1₁ и продлеваем (штрих) — далеко вверх, туда, где будет A₁.</p>",al:[2],
   why:'У [[l1|l]] две общие точки с плоскостью ⇒ вся прямая в плоскости. Прямая бесконечна — продлеваем смело.',mem:'<b>«Прямая — нитка, а не палочка»</b>: нарисован кусок, а тянется она бесконечно.'},
  {t:'5. Ответ: A₁',d:"<div class='formula'>A₁ = (линия связи из A₂) ∩ l₁</div>",al:[3],why:'A ∈ l ⇒ [[A1|A₁]] на l₁ и на вертикали из A₂. Пересечение выше рамки листа — так и должно быть при таком положении A₂.',
   alt:{ok:1,q:'Как проверить себя?',a:'Возьми другой посредник, например через B: B₂A₂ ∩ C₂D₂ → перенеси → B₁… Он должен прийти в ту же A₁. Два разных посредника — одна точка ⇒ ошибки нет.'}}]});}

 given:['Σ(m, B)','A ∈ Σ;  A₂','A₁ — ?'],
 algo:[['m₁ ∥ m₂ ∥ x ⇒ m ⊥ П₃ ⇒ Σ ⊥ П₃ (ЧП)'],['l ∋ B, A:  1₂ = B₂A₂ ∩ m₂'],['1₂ → 1₁ ∈ m₁;  l₁ = B₁1₁ (продлить)'],['A₁ = (линия связи из A₂) ∩ l₁']],
 legend:LEG('Σ(m, B)'),
 sheet:sheet('3-54','m₂ и m₁ — две горизонтальные линии (обе ∥ краю листа). B₂ сверху и B₁ снизу на одной вертикали. A₂ — слева внизу. Σ(m, B) — «плоскость задана прямой m и точкой B».',FAR),
 answer:'A₁ = линия связи из A₂ ∩ l₁ (l₁ = B₁1₁). Проверка: A₃ ∈ Σ₃.',
 checks:['1₂ на m₂, 1₁ на m₁ — на одной вертикали','B₁, 1₁, A₁ на одной прямой'],
 why:{A2g:'<b>A₂</b> — дано: точка A спереди.',m2:'<b>m₂ ∥ x</b> — горизонтальная линия.',m1:'<b>m₁ ∥ x</b> — тоже горизонтальная. Обе проекции «ровные» ⇒ m ∥ оси x.',l2:'<b>l₂ = B₂A₂</b> — посредник через точку B (она известна в обеих проекциях).',p1:'<b>1</b> = l ∩ m — общая точка посредника и прямой m.',l1:'<b>l₁ = B₁1₁</b>: B и 1 лежат в Σ ⇒ l ⊂ Σ.',A1:'<b>A₁</b> = линия связи из A₂ ∩ l₁.',bad:'<b>h′₂ ∥ m₂</b> — горизонталь через A₂ параллельна m₂ и никогда её не пересечёт.'},
 build(){const Dr=new Draw();Dr.fill([M0,M1,B],'s1',0,'Σ');

  Dr.lk(one,3,{id:'p1'});Dr.pt(Hp(one),'aux',3,'1₁',{id:'p1'});

  Dr.lk(A,5,{id:'A1'});Dr.pt(Hp(A),'res',5,'A₁',{id:'A1'});Dr.pt(Fp(A),'res',5,'A₂',{id:'A1'});
  return{D:Dr,P:{A,B,M0,M1,one}};},
 steps:[
  {t:'Условие',d:'<p>Σ задана прямой m и точкой B. Дана A₂, найти A₁.</p>',al:[],why:'Точка + прямая задают плоскость: через B и любую точку m проходят прямые этой плоскости.',
   ask:{q:'Обе проекции m горизонтальны. Что это значит?',a:'m ∥ оси x, то есть m ⊥ П₃. Плоскость, содержащая такую прямую, перпендикулярна П₃ — профильно-проецирующая.'}},
  {t:'1. Анализ: Σ ⊥ П₃',d:"<div class='formula'>m₁ ∥ m₂ ∥ x ⇒ m ⊥ П₃ ⇒ Σ ⊥ П₃</div><p>На П₁ и П₂ плоскость не слиплась — решаем посредником.</p>",al:[0],
   why:'[[m2,m1|m]] ∥ x: сбоку (на П₃) прямая — точка, а плоскость — линия Σ₃. Но П₃ на листе нет, поэтому работаем на П₁ и П₂.',mem:'<b>Обе проекции прямой «ровные»</b> ⇒ прямая — «шпала» вдоль x; плоскость через неё сбоку видна линией.',
   alt:{q:'А почему не горизонталь через A₂?',a:'В этой плоскости все горизонтали ∥ m (∥ x). Горизонталь через A₂ пойдёт параллельно m₂ и не пересечёт её — общих точек не будет (бледный штрих).',
    build(B){const{A,M0,M1}=B.P,D=new Draw();D.seg([M0.x-10,A.f],[M1.x+10,A.f],'bad',0,'h′₂ ∥ m₂ ?',{id:'bad',labAt:'b'});return D;}}},
  {t:'2. Посредник: l₂ = B₂A₂',d:"<div class='formula'>l ∋ B, A;  1₂ = B₂A₂ ∩ m₂</div>",al:[1],why:'Прямая через [[l2|B и A]]: точка B уже известна в обеих проекциях. Вторая опора — [[p1|1]] на m.'},
  {t:'3. Перенос: 1₂ → 1₁',d:"<div class='formula'>1 ∈ m ⇒ 1₁ ∈ m₁</div>",al:[2],why:'[[p1|1]] лежит на m ⇒ 1₁ на [[m1|m₁]] под 1₂.'},
  {t:'4. l₁ = B₁1₁ и продлеваем',d:'<p>Соединяем B₁ и 1₁ и продлеваем за 1₁ — далеко вверх.</p>',al:[2],why:'B ∈ Σ, 1 ∈ Σ ⇒ [[l1|l]] ⊂ Σ. A₂ сильно ниже m₂ (в 4 раза дальше, чем B₂ выше), поэтому и A₁ уйдёт от m₁ в 4 раза дальше, чем B₁ — в другую сторону.'},
  {t:'5. Ответ: A₁',d:"<div class='formula'>A₁ = (линия связи из A₂) ∩ l₁</div>",al:[3],why:'A ∈ l ⇒ [[A1|A₁]] на l₁.',

 checks:['1 перенесена на m₂, 2 — на n₂ (не перепутаны)','A₂ на продолжении 1₂2₂'],
 why:{A1g:'<b>A₁</b> — дано: точка A сверху. Стоит наверху листа — «не в своей зоне», это допустимо.',l1:'<b>l₁</b> — посредник через A₁, пересекает m₁ и n₁.',p1:'<b>1</b> = l ∩ m.',p2:'<b>2</b> = l ∩ n.',l2:'<b>l₂ = 1₂2₂</b> — две общие точки ⇒ l ⊂ Θ.',A2:'<b>A₂</b> = линия связи из A₁ ∩ l₂.',bad:'<b>l₁ ∥ m₁</b> не пересечёт ни m, ни n — опереться не на что.'},

  return{D:Dr,P:{A,M0,M1,N0,N1,one,two}};},
 steps:[
  {t:'Условие',d:'<p>Θ задана двумя параллельными прямыми m и n. Дана A₁, найти A₂.</p>',al:[],why:'[[A1g|A₁]] нарисована вверху — среди проекций спереди. Не пугайся: «зона» на безосном листе ничего не значит.'},
  {t:'1. Анализ: Θ — общего положения',d:"<div class='formula'>m₁ ≠ n₁,  m₂ ≠ n₂ (не слились) ⇒ ОП</div>",al:[0],why:'Если бы [[m,n|m₁ и n₁]] совпали в одну линию — плоскость была бы проецирующей и всё решалось бы одной линией связи.'},
  {t:'2. Посредник сверху: l₁ через A₁',d:"<div class='formula'>l₁ ∋ A₁;  1₁ = l₁ ∩ m₁,  2₁ = l₁ ∩ n₁</div>",al:[1],why:'Любая прямая через A₁, которая режет и m₁, и n₁, годится. Бери её «поперёк» прямых — пересечения будут чёткими: [[p1|1₁]] и [[p2|2₁]].',
   mem:'<b>Лестница</b>: m и n — две перекладины, посредник — стойка, упёртая в обе.',
   alt:{q:'А можно провести l₁ ∥ m₁?',a:'Нет: такая прямая не пересечёт ни m, ни n — общих точек нет (бледный штрих).',build(B){const{A,M0,M1}=B.P,D=new Draw(),dx=M1.x-M0.x,dh=M1.h-M0.h;D.seg([A.x-dx*.9,A.h-dh*.9],[A.x+dx*.25,A.h+dh*.25],'bad',0,'l₁ ∥ m₁ ?',{id:'bad'});return D;}}},
  {t:'3. Перенос 1 и 2 вверх',d:"<div class='formula'>1 ∈ m ⇒ 1₂ ∈ m₂;   2 ∈ n ⇒ 2₂ ∈ n₂</div>",al:[2],why:'Каждая точка — по своей вертикали и на свою прямую: [[p1|1]] на m, [[p2|2]] на n.',mem:'<b>«Линия связи — лифт»</b>: ездит только вертикально и только между проекциями одной точки.'},
  {t:'4. l₂ = 1₂2₂ и продлеваем',d:'<p>Соединяем 1₂ и 2₂ и продлеваем вниз — к будущей A₂.</p>',al:[2],why:'1 ∈ Θ, 2 ∈ Θ ⇒ [[l2|l]] ⊂ Θ.'},
  {t:'5. Ответ: A₂',d:"<div class='formula'>A₂ = (линия связи из A₁) ∩ l₂</div>",al:[3],why:'A ∈ l ⇒ [[A2|A₂]] на l₂. A лежит за прямой n — вне полосы между m и n, но в плоскости.'}]});}

T.push({id:'d56',num:'№ 5',tab:'Задача 5',title:'Σ(h ∩ f), дана A₁ — найти A₂',sub:'Посредник — новая горизонталь h′ через A',

 answer:'A₂ — на h′₂ (горизонтальная линия через 1₂) над A₁, чуть выше h₂.',
 checks:['h′₁ ∥ h₁','h′₂ ∥ x (горизонтальна)','проверка фронталью f′ даёт ту же A₂'],

  Dr.lk(A,5,{id:'A2'});Dr.pt(Fp(A),'res',5,'A₂',{id:'A2'});Dr.pt(Hp(A),'res',5,'A₁',{id:'A2'});

 steps:[
  {t:'Условие',d:'<p>Σ задана горизонталью h и фронталью f (пересекаются в K). Дана A₁, найти A₂.</p>',al:[],why:'Напоминание: у горизонтали [[h|h₂ ∥ x]], у фронтали [[f|f₁ ∥ x]].',
   ask:{q:'Какой посредник выгоднее, если дана A₁?',a:'Горизонталь h′: сверху h′₁ ∥ h₁ (рисуется сразу), спереди h′₂ ∥ x (тоже без вычислений). Нужно перенести всего одну точку.'}},

  {t:'2. h′₁ ∥ h₁ через A₁',d:"<div class='formula'>h′ ∋ A,  h′ ∥ h:  h′₁ ∥ h₁;  1₁ = h′₁ ∩ f₁</div>",al:[1],why:'Все горизонтали плоскости параллельны — это «срезы» на разных высотах. [[hp1|h′₁]] пересекает f₁ в [[p1|1₁]].',mem:'<b>«Аш-два и эф-один — ровные»</b>: h₂ ∥ x, f₁ ∥ x.'},
  {t:'3. Перенос: 1₁ → 1₂ на f₂',d:"<div class='formula'>1 ∈ f ⇒ 1₂ ∈ f₂</div>",al:[2],why:'[[p1|1]] лежит на f ⇒ 1₂ на f₂ над 1₁.'},
  {t:'4. h′₂ ∥ x через 1₂',d:'<p>Спереди горизонталь — горизонтальная линия через 1₂.</p>',al:[2],why:'Горизонталь — линия одной высоты ⇒ [[hp2|h′₂]] ∥ x.',alt:{q:'А если провести h′₂ наклонно?',a:'Тогда это уже не горизонталь, и A₂ уедет. Спереди горизонталь всегда ровная — это её определение.'}},
  {t:'5. Ответ: A₂',d:"<div class='formula'>A₂ = (линия связи из A₁) ∩ h′₂</div>",al:[3],why:'A ∈ h′ ⇒ [[A2|A₂]] на h′₂.',
   alt:{ok:1,q:'Самопроверка фронталью f′',a:'Через A₁ проводим f′₁ ∥ x → пересекает h₁ в 2₁ → вверх на h₂ → 2₂ → через 2₂ f′₂ ∥ f₂. Она проходит через ту же A₂ (контрастный штрих). Два разных посредника — одна точка ⇒ ошибки нет.',

  return{D:Dr,P:{A,K,M,N,one,two,dm}};},
 steps:[

  {t:'3. Перенос: 1₁ → 1₂ на m₂',d:"<div class='formula'>1 ∈ m ⇒ 1₂ ∈ m₂</div>",al:[2],why:'[[p1|1]] лежит на m ⇒ 1₂ на m₂.'},

 algo:[['BC, DE — профильные (обе проекции вертикальны)','⇒ по ним точки не переносить'],['CD ⊂ Θ (C, D ∈ Θ) — обычная прямая'],['l ∋ B, A:  1₂ = B₂A₂ ∩ C₂D₂ → 1₁ ∈ C₁D₁'],['A₁ = (линия связи из A₂) ∩ B₁1₁']],
 legend:LEG('Θ(BC ∥ DE)'),

 answer:'A₁ — на прямой B₁1₁ под A₂.',
 checks:['CD достроена в обеих проекциях','1₁ на C₁D₁ строго под 1₂'],
 why:{A2g:'<b>A₂</b> — дано.',BC:'<b>BC</b> — профильная прямая: обе проекции вертикальны.',DE:'<b>DE</b> — тоже профильная, ∥ BC.',CD:'<b>CD</b> — обычная прямая плоскости: C и D лежат в Θ.',l2:'<b>l₂ = B₂A₂</b> до C₂D₂.',p1:'<b>1</b> = l ∩ CD.',l1:'<b>l₁ = B₁1₁</b>.',A1:'<b>A₁</b> = линия связи из A₂ ∩ l₁.',bad:'Линия связи из точки на B₂C₂ бежит <b>вдоль</b> B₁C₁ — пересечения нет.'},
 build(){const Dr=new Draw();Dr.fill([B,C,D,E],'s1',0,'Θ');Dr.poly([Fp(B),Fp(C),Fp(D),Fp(E)],'s1',0).poly([Hp(B),Hp(C),Hp(D),Hp(E)],'s1',0);

  Dr.lk(A,5,{id:'A1'});Dr.pt(Hp(A),'res',5,'A₁',{id:'A1'});Dr.pt(Fp(A),'res',5,'A₂',{id:'A1'});

 steps:[
  {t:'Условие',d:'<p>Θ задана двумя параллельными профильными прямыми BC и DE. Дана A₂, найти A₁.</p>',al:[],why:'У профильной прямой обе проекции вертикальны — по ним не видно её наклона «вглубь».',
   ask:{q:'Можно ли взять точку на B₂C₂ и опустить её на B₁C₁?',a:'Нет: линия связи вертикальна и совпадёт с самой B₁C₁ — пересечения нет, точку придётся «угадать на глаз».'}},
  {t:'1. Анализ: ОП, но с подвохом',d:"<div class='formula'>BCDE не слиплась ⇒ ОП;  BC, DE — профильные</div>",al:[0],why:'[[BC|BC]] и [[DE|DE]] стоят вертикально на обоих видах. Две параллельные профильные прямые на разных x задают плоскость <b>общего</b> положения (профильные прямые ≠ профильная плоскость).',
   mem:'<b>«С профильной прямой лифт не ходит».</b> Вертикаль с B₂C₂ бежит вдоль B₁C₁. Опирайся на обычные прямые.',
   alt:{q:'Что будет, если всё же переносить по BC?',a:'Линия связи из точки на B₂C₂ ляжет прямо на B₁C₁ (бледный штрих) — пересечения нет. Выход: деление отрезка в том же отношении или П₃ — дольше.',build(B){const{B:Bv,C}=B.P,D=new Draw(),m=L3(Bv,C,.45);D.seg([m.x,m.f],[m.x,Bv.h+40],'bad',0,'?',{id:'bad'});D.pt([m.x,m.f],'bad',0,'1₂ ?',{id:'bad'});return D;}}},
  {t:'2. Достраиваем сторону CD',d:"<div class='formula'>C ∈ Θ, D ∈ Θ ⇒ CD ⊂ Θ</div><p>Соединяем C₂D₂ и C₁D₁.</p>",al:[1],why:'[[CD|CD]] — обычная, наклонная прямая: по ней переносить можно. Концы известны — ничего вычислять не нужно.'},
  {t:'3. Посредник: l₂ = B₂A₂ до C₂D₂',d:"<div class='formula'>l ∋ B, A;  1₂ = l₂ ∩ C₂D₂</div>",al:[2],why:'B известна в обеих проекциях, [[p1|1]] — на «нормальной» прямой CD.'},
  {t:'4. 1₁ на C₁D₁;  l₁ = B₁1₁',d:"<div class='formula'>1 ∈ CD ⇒ 1₁ ∈ C₁D₁</div>",al:[2],why:'Переносим [[p1|1]] вниз и соединяем с B₁ — это [[l1|l₁]].'},
  {t:'5. Ответ: A₁',d:"<div class='formula'>A₁ = (линия связи из A₂) ∩ l₁</div>",al:[3],why:'A ∈ l ⇒ [[A1|A₁]] на l₁. [[@iso|В 3D]] видно: BC и DE — как боковины стремянки, а CD — ступенька.'}]});}

  return{D:Dr,P:{A,B,C,D,E,one}};},
 steps:[
  {t:'Условие',d:'<p>Σ задана плоским четырёхугольником BCDE. Дана A₂, найти A₁.</p>',al:[],why:'Вершин больше — но это всё та же плоскость. Метод не меняется.',
   ask:{q:'Почему здесь неудобна горизонталь через A₂?',a:'A₂ ниже всех вершин спереди: горизонтальная линия через A₂ пересечёт только продолжения сторон, далеко за фигурой. Удобнее прямая через вершину C.'}},
  {t:'1. Анализ: Σ — общего положения',d:"<div class='formula'>BCDE не слиплась ⇒ ОП</div>",al:[0],why:'Ни одна проекция не стала линией — нужен посредник через A.'},

  {t:'3. Перенос: 1₂ → 1₁ на D₁E₁',d:"<div class='formula'>1 ∈ DE ⇒ 1₁ ∈ D₁E₁</div>",al:[2],why:'Смотри, на пересечении с <b>какой</b> стороной получилась 1₂ — на ту же сторону и сверху.'},
  {t:'4. l₁ = C₁1₁ и продлеваем',d:'<p>Соединяем C₁ с 1₁ и продлеваем за 1₁ — вверх-вправо.</p>',al:[2],why:'C и 1 — общие точки ⇒ [[l1|l]] ⊂ Σ.'},
  {t:'5. Ответ: A₁',d:"<div class='formula'>A₁ = (линия связи из A₂) ∩ l₁</div>",al:[3],why:'A ∈ l ⇒ [[A1|A₁]] на l₁. A₁ оказалась вверху листа, среди видов спереди, — «не в своей зоне», это допустимо.'}]});}

 steps:[

   ask:{q:'Дана A₂. Какую линию уровня выгодно провести?',a:'Горизонталь: h′₂ ∥ x через A₂ рисуется сразу, без вычислений.'}},
  {t:'1. Анализ: Ω — общего положения',d:"<div class='formula'>f₂, h₁ наклонные ⇒ ОП</div>",al:[0],why:'Ничего не слиплось. f₁ ∥ x и h₂ ∥ x — свойства линий уровня, а не особой плоскости.'},
  {t:'2. h′₂ ∥ x через A₂ → 1₂',d:"<div class='formula'>h′ ∋ A;  1₂ = h′₂ ∩ (продолжение f₂)</div><p>Нарисованный кусок f₂ горизонталь не встречает — продлеваем f₂ вниз-влево (штрих).</p>",al:[1],

  {t:'3. Перенос: 1₂ → 1₁ на f₁',d:"<div class='formula'>1 ∈ f ⇒ 1₁ ∈ f₁ (горизонтальная линия)</div>",al:[2],why:'1 лежит на <b>f</b>, поэтому переносим на [[fh|f₁]] — горизонтальную линию, а не на h₁.',
